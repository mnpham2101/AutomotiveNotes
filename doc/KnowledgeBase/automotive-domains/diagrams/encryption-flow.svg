<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 110" width="760" height="110" font-family="Arial, sans-serif">

  <!-- Plaintext -->
  <rect x="10" y="30" width="110" height="50" rx="6" fill="#0d2a40" stroke="#3a7fc1" stroke-width="2"/>
  <text x="65" y="51" font-size="11" font-weight="bold" fill="#7bbfea" text-anchor="middle">Plaintext</text>
  <text x="65" y="68" font-size="10" fill="#a0c4e0" text-anchor="middle">readable data</text>

  <!-- Arrow 1 -->
  <line x1="120" y1="55" x2="160" y2="55" stroke="#3a7fc1" stroke-width="2"/>
  <polygon points="160,50 170,55 160,60" fill="#3a7fc1"/>

  <!-- Encryption box -->
  <rect x="170" y="20" width="130" height="70" rx="6" fill="#12406a" stroke="#5a9fd4" stroke-width="2"/>
  <text x="235" y="47" font-size="11" font-weight="bold" fill="#7bbfea" text-anchor="middle">Encryption</text>
  <text x="235" y="64" font-size="9" fill="#a0c4e0" text-anchor="middle">AES / RSA</text>
  <text x="235" y="78" font-size="9" fill="#a0c4e0" text-anchor="middle">key applied</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="55" x2="340" y2="55" stroke="#3a7fc1" stroke-width="2"/>
  <polygon points="340,50 350,55 340,60" fill="#3a7fc1"/>

  <!-- Ciphertext -->
  <rect x="350" y="30" width="110" height="50" rx="6" fill="#0d2a40" stroke="#3a7fc1" stroke-width="2"/>
  <text x="405" y="51" font-size="11" font-weight="bold" fill="#7bbfea" text-anchor="middle">Ciphertext</text>
  <text x="405" y="68" font-size="10" fill="#a0c4e0" text-anchor="middle">unreadable</text>

  <!-- Arrow 3 (transmit) -->
  <line x1="460" y1="55" x2="490" y2="55" stroke="#3a7fc1" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="490,50 500,55 490,60" fill="#3a7fc1"/>
  <text x="475" y="45" font-size="9" fill="#6a9ebf" text-anchor="middle">transmit</text>

  <!-- Decryption box -->
  <rect x="500" y="20" width="130" height="70" rx="6" fill="#12406a" stroke="#5a9fd4" stroke-width="2"/>
  <text x="565" y="47" font-size="11" font-weight="bold" fill="#7bbfea" text-anchor="middle">Decryption</text>
  <text x="565" y="64" font-size="9" fill="#a0c4e0" text-anchor="middle">private/shared</text>
  <text x="565" y="78" font-size="9" fill="#a0c4e0" text-anchor="middle">key applied</text>

  <!-- Arrow 4 -->
  <line x1="630" y1="55" x2="660" y2="55" stroke="#3a7fc1" stroke-width="2"/>
  <polygon points="660,50 670,55 660,60" fill="#3a7fc1"/>

  <!-- Plaintext restored -->
  <rect x="670" y="30" width="80" height="50" rx="6" fill="#0d2a40" stroke="#3a7fc1" stroke-width="2"/>
  <text x="710" y="51" font-size="11" font-weight="bold" fill="#7bbfea" text-anchor="middle">Plaintext</text>
  <text x="710" y="68" font-size="10" fill="#a0c4e0" text-anchor="middle">restored</text>

</svg>
