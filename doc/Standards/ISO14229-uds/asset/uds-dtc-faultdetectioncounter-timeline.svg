<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="1180" height="520" fill="#ffffff"/>

  <text x="590" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">DTCFaultDetectionCounter ↔ testFailed bit (bit 0) — adapted from Annex D.6, Figure D.10</text>
  <text x="20" y="42" font-size="10.5" fill="#607d8b">One test's counter trace against bits 0 (testFailed), 1 (testFailedThisOperationCycle) and 5 (testFailedSinceLastClear) across two operation cycles.</text>

  <!-- Operation Cycle row -->
  <text x="20" y="83" font-size="9" font-weight="bold" fill="#263238">Operation</text>
  <text x="20" y="94" font-size="9" font-weight="bold" fill="#263238">Cycle</text>
  <rect x="150" y="65" width="700" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="500" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 1</text>
  <rect x="850" y="65" width="300" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="1000" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 2</text>
  <text x="150" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">start</text>
  <text x="850" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="1163" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">…</text>

  <!-- Fault Detection Counter row -->
  <text x="20" y="162" font-size="9" font-weight="bold" fill="#263238">Fault</text>
  <text x="20" y="173" font-size="9" font-weight="bold" fill="#263238">Detection</text>
  <text x="20" y="184" font-size="9" font-weight="bold" fill="#263238">Counter</text>

  <line x1="150" y1="125" x2="1150" y2="125" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="128" text-anchor="end" font-size="8" fill="#90a4ae">+127 (max)</text>
  <line x1="150" y1="170" x2="1150" y2="170" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="173" text-anchor="end" font-size="8" fill="#90a4ae">0</text>
  <line x1="150" y1="215" x2="1150" y2="215" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="218" text-anchor="end" font-size="8" fill="#90a4ae">minimum</text>

  <polyline points="150,170 190,170 190,180 230,180 230,192 270,192 270,158 370,158 410,158 410,146 450,146 450,136 490,136 490,128 530,128 530,125 570,125 610,125 610,140 650,140 650,158 690,158 690,178 730,178 730,198 770,198 770,215 850,215 850,170 1150,170"
            fill="none" stroke="#00838f" stroke-width="2.5"/>
  <circle cx="270" cy="158" r="4" fill="#00838f"/>
  <circle cx="570" cy="125" r="4" fill="#00838f"/>
  <circle cx="770" cy="215" r="4" fill="#00838f"/>
  <circle cx="850" cy="170" r="4" fill="#00838f"/>
  <text x="210" y="222" text-anchor="middle" font-size="7.5" fill="#00838f">each passed sample decrements it</text>
  <text x="470" y="222" text-anchor="middle" font-size="7.5" fill="#00838f">each failed test sample increments the counter</text>
  <text x="670" y="222" text-anchor="middle" font-size="7.5" fill="#00838f">each passed test sample decrements it</text>

  <!-- bit rows -->
  <text x="20" y="253" font-size="9" font-weight="bold" fill="#c2185b">bit 0</text>
  <text x="20" y="264" font-size="8" fill="#c2185b">testFailed</text>
  <line x1="150" y1="265" x2="1150" y2="265" stroke="#eceff1"/>
  <polyline points="150,265 570,265 570,235 770,235 770,265 1150,265" fill="none" stroke="#c2185b" stroke-width="2.5"/>

  <text x="20" y="288" font-size="9" font-weight="bold" fill="#5e35b1">bit 1</text>
  <text x="20" y="298" font-size="7" fill="#5e35b1">testFailedThis</text>
  <text x="20" y="307" font-size="7" fill="#5e35b1">OperationCycle</text>
  <line x1="150" y1="310" x2="1150" y2="310" stroke="#eceff1"/>
  <polyline points="150,310 570,310 570,280 850,280 850,310 1150,310" fill="none" stroke="#5e35b1" stroke-width="2.5"/>

  <text x="20" y="333" font-size="9" font-weight="bold" fill="#2e7d32">bit 5</text>
  <text x="20" y="343" font-size="7" fill="#2e7d32">testFailedSince</text>
  <text x="20" y="352" font-size="7" fill="#2e7d32">LastClear</text>
  <line x1="150" y1="355" x2="1150" y2="355" stroke="#eceff1"/>
  <polyline points="150,355 570,355 570,325 1150,325" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- markers -->
  <line x1="270" y1="108" x2="270" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="270" cy="108" r="9" fill="#f26f21"/>
  <text x="270" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="570" y1="108" x2="570" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="570" cy="108" r="9" fill="#f26f21"/>
  <text x="570" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <line x1="770" y1="108" x2="770" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="770" cy="108" r="9" fill="#f26f21"/>
  <text x="770" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <line x1="850" y1="108" x2="850" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="850" cy="108" r="9" fill="#f26f21"/>
  <text x="850" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">4</text>

  <!-- legend -->
  <circle cx="28" cy="381" r="8" fill="#f26f21"/>
  <text x="28" y="384" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="385" font-size="9.5" fill="#263238">A run of passed samples has decremented the counter into negative territory; one failed sample jumps it straight above 0, not step by step [key 2]</text>

  <circle cx="28" cy="403" r="8" fill="#f26f21"/>
  <text x="28" y="406" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="407" font-size="9.5" fill="#263238">Counter reaches +127 (max) — fault fully matured — bits 0, 1 and 5 all set 0 → 1 together</text>

  <circle cx="28" cy="425" r="8" fill="#f26f21"/>
  <text x="28" y="428" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="429" font-size="9.5" fill="#263238">Counter falls back to its minimum — only bit 0 resets 1 → 0; bits 1 and 5 are untouched</text>

  <circle cx="28" cy="447" r="8" fill="#f26f21"/>
  <text x="28" y="450" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">4</text>
  <text x="44" y="451" font-size="9.5" fill="#263238">Cycle 1 stops / Cycle 2 starts — the new cycle's monitor hasn't run yet, so the counter restarts at 0 [key 8]; bit 1 resets 1 → 0 (this cycle only); bit 0 stays 0</text>

  <text x="20" y="478" font-size="9.5" fill="#607d8b">bit 5 (testFailedSinceLastClear) never resets on its own — only ClearDiagnosticInformation (0x14) clears it [Annex D.2].</text>
  <text x="20" y="494" font-size="8.5" fill="#90a4ae">Simplified from Figure D.10 (Annex D.6) — the real figure also tracks Test, Test Sample, pendingDTC, confirmedDTC and two more status bits.</text>
</svg>
