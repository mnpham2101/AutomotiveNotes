<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <text x="480" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">DTCFaultDetectionCounter ↔ status bits — simplified from Annex D.6, Figure D.10</text>
  <text x="20" y="42" font-size="10.5" fill="#607d8b">One test's counter trace against bits 0 (testFailed), 1 (testFailedThisOperationCycle) and 5 (testFailedSinceLastClear) across two operation cycles.</text>

  <!-- Operation Cycle row -->
  <text x="20" y="83" font-size="9" font-weight="bold" fill="#263238">Operation</text>
  <text x="20" y="94" font-size="9" font-weight="bold" fill="#263238">Cycle</text>
  <rect x="150" y="65" width="500" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="400" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 1</text>
  <rect x="650" y="65" width="270" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="785" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 2</text>
  <text x="150" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">start</text>
  <text x="650" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="920" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">…</text>

  <!-- Fault Detection Counter row -->
  <text x="20" y="162" font-size="9" font-weight="bold" fill="#263238">Fault</text>
  <text x="20" y="173" font-size="9" font-weight="bold" fill="#263238">Detection</text>
  <text x="20" y="184" font-size="9" font-weight="bold" fill="#263238">Counter</text>

  <line x1="150" y1="125" x2="920" y2="125" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="128" text-anchor="end" font-size="8" fill="#90a4ae">+127 (max)</text>
  <line x1="150" y1="170" x2="920" y2="170" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="173" text-anchor="end" font-size="8" fill="#90a4ae">0</text>
  <line x1="150" y1="215" x2="920" y2="215" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="218" text-anchor="end" font-size="8" fill="#90a4ae">minimum</text>

  <polyline points="150,170 190,170 190,158 230,158 230,146 270,146 270,136 310,136 310,128 350,128 350,125"
            fill="none" stroke="#00838f" stroke-width="2.5"/>
  <polyline points="350,125 390,125 390,140 430,140 430,158 470,158 470,178 510,178 510,198 550,198 550,215"
            fill="none" stroke="#00838f" stroke-width="2.5"/>
  <polyline points="550,215 650,215 900,215" fill="none" stroke="#00838f" stroke-width="2.5"/>
  <circle cx="350" cy="125" r="4" fill="#00838f"/>
  <circle cx="550" cy="215" r="4" fill="#00838f"/>
  <text x="240" y="222" text-anchor="middle" font-size="7.5" fill="#00838f">each failed test sample increments the counter</text>
  <text x="450" y="222" text-anchor="middle" font-size="7.5" fill="#00838f">each passed test sample decrements it</text>

  <!-- bit rows -->
  <text x="20" y="253" font-size="9" font-weight="bold" fill="#c2185b">bit 0</text>
  <text x="20" y="264" font-size="8" fill="#c2185b">testFailed</text>
  <line x1="150" y1="265" x2="920" y2="265" stroke="#eceff1"/>
  <polyline points="150,265 350,265 350,235 550,235 550,265 900,265" fill="none" stroke="#c2185b" stroke-width="2.5"/>

  <text x="20" y="288" font-size="9" font-weight="bold" fill="#5e35b1">bit 1</text>
  <text x="20" y="298" font-size="7" fill="#5e35b1">testFailedThis</text>
  <text x="20" y="307" font-size="7" fill="#5e35b1">OperationCycle</text>
  <line x1="150" y1="310" x2="920" y2="310" stroke="#eceff1"/>
  <polyline points="150,310 350,310 350,280 650,280 650,310 900,310" fill="none" stroke="#5e35b1" stroke-width="2.5"/>

  <text x="20" y="333" font-size="9" font-weight="bold" fill="#2e7d32">bit 5</text>
  <text x="20" y="343" font-size="7" fill="#2e7d32">testFailedSince</text>
  <text x="20" y="352" font-size="7" fill="#2e7d32">LastClear</text>
  <line x1="150" y1="355" x2="920" y2="355" stroke="#eceff1"/>
  <polyline points="150,355 350,355 350,325 900,325" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- markers -->
  <line x1="350" y1="108" x2="350" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="350" cy="108" r="9" fill="#f26f21"/>
  <text x="350" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="550" y1="108" x2="550" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="550" cy="108" r="9" fill="#f26f21"/>
  <text x="550" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <line x1="650" y1="108" x2="650" y2="355" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="650" cy="108" r="9" fill="#f26f21"/>
  <text x="650" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <!-- legend -->
  <circle cx="28" cy="381" r="8" fill="#f26f21"/>
  <text x="28" y="384" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="385" font-size="9.5" fill="#263238">Counter reaches +127 (max) — fault fully matured — bits 0, 1 and 5 all set 0 → 1 together</text>

  <circle cx="28" cy="401" r="8" fill="#f26f21"/>
  <text x="28" y="404" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="405" font-size="9.5" fill="#263238">Counter falls back to its minimum — only bit 0 resets 1 → 0; bits 1 and 5 are untouched</text>

  <circle cx="28" cy="421" r="8" fill="#f26f21"/>
  <text x="28" y="424" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="425" font-size="9.5" fill="#263238">Cycle 1 stops / Cycle 2 starts — bit 1 resets 1 → 0 because its scope is "this operation cycle"; bit 0 is already 0</text>

  <text x="20" y="452" font-size="9.5" fill="#607d8b">bit 5 (testFailedSinceLastClear) never resets on its own — only ClearDiagnosticInformation (0x14) clears it [Annex D.2].</text>
  <text x="20" y="468" font-size="8.5" fill="#90a4ae">Simplified from Figure D.10 (Annex D.6) — the real figure also tracks Test, Test Sample, pendingDTC, confirmedDTC and two more status bits.</text>
</svg>
