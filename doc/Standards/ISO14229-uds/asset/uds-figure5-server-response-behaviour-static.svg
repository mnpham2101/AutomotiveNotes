<svg viewBox="0 0 1360 1040" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="1360" height="1040" fill="#ffffff"/>

  <defs>
    <marker id="fig5arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="680" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">Figure 5 — General Server Response Behaviour</text>
  <text x="680" y="46" text-anchor="middle" font-size="10.5" fill="#607d8b">Mandatory pre-requisite checks every request undergoes, before the service's own response table (or Figure 6, for services with a sub-function).</text>

  <!-- Swim-lane dividers + headers -->
  <line x1="520" y1="96" x2="520" y2="920" stroke="#cfd8dc" stroke-dasharray="4 3"/>
  <line x1="890" y1="96" x2="890" y2="920" stroke="#cfd8dc" stroke-dasharray="4 3"/>
  <text x="270" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">mandatory</text>
  <text x="705" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#607d8b">optional</text>
  <text x="1115" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#5e35b1">manufacturer/supplier specific</text>

  <!-- Start -->
  <circle cx="220" cy="135" r="13" fill="#263238"/>

  <!-- Connector: start -> diamond1 -->
  <line x1="233" y1="135" x2="565" y2="135" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 1: Server is busy? (optional) -->
  <text x="600" y="100" font-size="9.5" font-weight="bold" fill="#e65100">[1]</text>
  <polygon points="650,105 725,135 650,165 575,135" fill="#fff3e0" stroke="#607d8b" stroke-width="1.6"/>
  <text x="650" y="131" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Server is</text>
  <text x="650" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">busy?</text>
  <text x="700" y="122" font-size="9" fill="#455a64">YES</text>
  <line x1="725" y1="135" x2="765" y2="135" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="765" y="113" width="120" height="44" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="825" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0x21</text>
  <text x="825" y="142" text-anchor="middle" font-size="8" fill="#607d8b">busyRepeatRequest</text>

  <text x="655" y="180" font-size="9" fill="#455a64">NO</text>
  <path d="M 650,165 L 650,195 L 220,195 L 220,250" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 2: manufacturer specific failure detected? (mfg) -->
  <line x1="220" y1="250" x2="985" y2="250" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <polygon points="1080,213 1175,250 1080,287 985,250" fill="#fff3e0" stroke="#5e35b1" stroke-width="1.6"/>
  <text x="1080" y="241" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">manufacturer</text>
  <text x="1080" y="253" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">specific failure</text>
  <text x="1080" y="265" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">detected?</text>
  <text x="1130" y="237" font-size="9" fill="#455a64">YES</text>
  <line x1="1175" y1="250" x2="1195" y2="250" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="1195" y="228" width="115" height="44" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="1252" y="245" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0xXX</text>
  <text x="1252" y="257" text-anchor="middle" font-size="8" fill="#607d8b">manufacturer-specific</text>

  <text x="1085" y="302" font-size="9" fill="#455a64">NO</text>
  <path d="M 1080,287 L 1080,315 L 220,315 L 220,352" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 3: SID supported? (mandatory) -->
  <polygon points="220,352 295,380 220,408 145,380" fill="#fff3e0" stroke="#1565c0" stroke-width="1.6"/>
  <text x="220" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">SID supported?</text>
  <text x="255" y="368" font-size="9" fill="#455a64">NO</text>
  <line x1="295" y1="380" x2="335" y2="380" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="335" y="358" width="115" height="44" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="392" y="375" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0x11</text>
  <text x="392" y="387" text-anchor="middle" font-size="8" fill="#607d8b">serviceNotSupported</text>

  <text x="228" y="425" font-size="9" fill="#455a64">YES</text>
  <line x1="220" y1="408" x2="220" y2="478" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 4: SID supported in active session? (mandatory) -->
  <polygon points="220,478 305,515 220,552 135,515" fill="#fff3e0" stroke="#1565c0" stroke-width="1.6"/>
  <text x="220" y="505" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">SID supported</text>
  <text x="220" y="517" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">in active</text>
  <text x="220" y="529" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">session?</text>
  <text x="312" y="508" font-size="9" fill="#455a64">YES</text>
  <line x1="305" y1="515" x2="570" y2="515" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <text x="312" y="546" font-size="9" fill="#455a64">NO</text>
  <path d="M 305,515 L 305,550 L 335,550" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="335" y="525" width="130" height="52" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="400" y="542" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0x7F</text>
  <text x="400" y="553" text-anchor="middle" font-size="7.5" fill="#607d8b">serviceNotSupported-</text>
  <text x="400" y="563" text-anchor="middle" font-size="7.5" fill="#607d8b">InActiveSession</text>

  <!-- Diamond 5: SID security check o.k.? (optional) -->
  <polygon points="650,483 730,515 650,547 570,515" fill="#fff3e0" stroke="#607d8b" stroke-width="1.6"/>
  <text x="650" y="511" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">SID security</text>
  <text x="650" y="523" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">check o.k.?</text>
  <text x="700" y="506" font-size="9" fill="#455a64">NO</text>
  <line x1="730" y1="515" x2="765" y2="515" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="765" y="493" width="115" height="44" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="822" y="510" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0x33</text>
  <text x="822" y="522" text-anchor="middle" font-size="8" fill="#607d8b">securityAccessDenied</text>

  <text x="655" y="562" font-size="9" fill="#455a64">YES</text>
  <path d="M 650,547 L 650,580 L 220,580 L 220,650" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 6: supplier specific failure detected? (mfg) -->
  <line x1="220" y1="650" x2="985" y2="650" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <polygon points="1080,613 1175,650 1080,687 985,650" fill="#fff3e0" stroke="#5e35b1" stroke-width="1.6"/>
  <text x="1080" y="641" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">supplier specific</text>
  <text x="1080" y="653" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">failure</text>
  <text x="1080" y="665" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">detected?</text>
  <text x="1130" y="637" font-size="9" fill="#455a64">YES</text>
  <line x1="1175" y1="650" x2="1195" y2="650" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="1195" y="628" width="115" height="44" rx="3" fill="#fce4ec" stroke="#c62828"/>
  <text x="1252" y="645" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">NRC 0xXX</text>
  <text x="1252" y="657" text-anchor="middle" font-size="8" fill="#607d8b">supplier-specific</text>

  <text x="1085" y="702" font-size="9" fill="#455a64">NO</text>
  <path d="M 1080,687 L 1080,720 L 220,720 L 220,758" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>

  <!-- Diamond 7: Service with sub-function, but not SID 0x31? (mandatory) -->
  <polygon points="220,758 325,795 220,832 115,795" fill="#fff3e0" stroke="#1565c0" stroke-width="1.6"/>
  <text x="220" y="778" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">Service with</text>
  <text x="220" y="790" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">sub-function, but</text>
  <text x="220" y="802" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">not SID 0x31?</text>

  <text x="90" y="812" font-size="9" fill="#455a64">YES</text>
  <line x1="115" y1="795" x2="115" y2="858" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <polygon points="80,858 150,858 150,885 115,912 80,885" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="115" y="881" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">1</text>
  <text x="115" y="935" text-anchor="middle" font-size="8.5" fill="#607d8b">→ Figure 6</text>

  <text x="228" y="845" font-size="9" fill="#455a64">NO</text>
  <path d="M 220,832 L 220,855 L 340,855" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#fig5arrow)"/>
  <rect x="280" y="855" width="160" height="54" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="360" y="878" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#263238">specific SID</text>
  <text x="360" y="892" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#263238">checks [2]</text>

  <!-- Key / footnotes -->
  <text x="20" y="955" font-size="11" font-weight="bold" fill="#263238">Key</text>
  <text x="20" y="973" font-size="9.5" fill="#263238">1&#160;&#160;Diagnostic request cannot be accepted because another diagnostic task is already requested and in progress by a different client.</text>
  <text x="20" y="989" font-size="9.5" fill="#263238">2&#160;&#160;Refer to the response behaviour (supported negative response codes) of each service.</text>

  <text x="20" y="1015" font-size="9.5" font-family="DejaVu Sans Mono, monospace" fill="#607d8b">[ISO 14229-1:2013, Clause 7.5.2, Figure 5]</text>
</svg>
