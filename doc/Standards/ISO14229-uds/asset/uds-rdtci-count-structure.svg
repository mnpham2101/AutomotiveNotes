<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="300" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">ReadDTCInformation 0x01 — reportNumberOfDTCByStatusMask (Clause 11.3.2 / 11.3.3, Table 271)</text>
  <text x="20" y="48" font-size="10.5" fill="#607d8b">"Count" shape — shared with 0x07, 0x11, 0x12 (reportNumberOf... variants): the response never lists DTCs, only how many match.</text>

  <!-- Request -->
  <text x="40" y="76" font-size="9.5" font-weight="bold" fill="#f26f21">Request — client → server (Table 256)</text>
  <rect x="40" y="82" width="90" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="85" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SID</text>
  <text x="85" y="112" text-anchor="middle" font-size="9" fill="#263238">0x19</text>
  <text x="85" y="123" text-anchor="middle" font-size="7.5" fill="#607d8b">RDTCI</text>

  <rect x="140" y="82" width="150" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="215" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">reportType</text>
  <text x="215" y="110" text-anchor="middle" font-size="9" fill="#263238">0x01</text>
  <text x="215" y="123" text-anchor="middle" font-size="7.5" fill="#607d8b">LEV_ · RNODTCBSM</text>

  <rect x="300" y="82" width="150" height="46" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="375" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">DTCStatusMask</text>
  <text x="375" y="110" text-anchor="middle" font-size="9" fill="#263238">0x00 – 0xFF</text>
  <text x="375" y="123" text-anchor="middle" font-size="7.5" fill="#607d8b">DTCSM · M</text>

  <!-- Response -->
  <text x="40" y="158" font-size="9.5" font-weight="bold" fill="#2e7d32">Positive response — server → client (Table 271)</text>
  <rect x="40" y="164" width="90" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="85" y="182" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SID</text>
  <text x="85" y="194" text-anchor="middle" font-size="9" fill="#263238">0x59</text>
  <text x="85" y="205" text-anchor="middle" font-size="7.5" fill="#607d8b">RDTCIPR</text>

  <rect x="140" y="164" width="110" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="195" y="182" text-anchor="middle" font-size="9" fill="#263238">reportType echo</text>
  <text x="195" y="194" text-anchor="middle" font-size="9" fill="#263238">0x01</text>

  <rect x="260" y="164" width="180" height="46" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="350" y="178" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#263238">DTCStatusAvailabilityMask</text>
  <text x="350" y="191" text-anchor="middle" font-size="9" fill="#263238">0x00 – 0xFF</text>
  <text x="350" y="204" text-anchor="middle" font-size="7.5" fill="#607d8b">DTCSAM · M</text>

  <rect x="450" y="164" width="150" height="46" fill="#e0f7fa" stroke="#00838f"/>
  <text x="525" y="178" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#263238">DTCFormatIdentifier</text>
  <text x="525" y="191" text-anchor="middle" font-size="9" fill="#263238">0x00 – 0x04</text>
  <text x="525" y="204" text-anchor="middle" font-size="7.5" fill="#607d8b">DTCFID_ · M</text>

  <rect x="610" y="164" width="150" height="46" fill="#fce4ec" stroke="#c2185b"/>
  <text x="685" y="182" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">DTCCount</text>
  <text x="685" y="194" text-anchor="middle" font-size="9" fill="#263238">2 bytes (HB, LB)</text>
  <text x="685" y="205" text-anchor="middle" font-size="7.5" fill="#607d8b">DTCC_ · M</text>

  <!-- DTCFormatIdentifier legend -->
  <text x="20" y="240" font-size="10" font-weight="bold" fill="#263238">DTCFormatIdentifier values (Table 271):</text>
  <text x="20" y="256" font-size="9.5" fill="#263238">0x00 SAE_J2012-DA_00   0x01 ISO_14229-1 (vehicle-manufacturer defined coding)   0x02 SAE_J1939-73   0x03 ISO_11992-4   0x04 SAE_J2012-DA_04</text>

  <text x="20" y="278" font-size="10" fill="#263238">Example (Clause 11.3.5.2, Tables 290–291): request 19 01 08 → response 59 01 2F 01 00 01 — one DTC (of three stored) matches mask 0x08.</text>
</svg>
