<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">confirmedDTC &amp; DTCAgingCounter — adapted from Annex D.2.1, Table D.6, Figure D.4 and D.7 / Figure D.11</text>
  <text x="20" y="42" font-size="10.5" fill="#607d8b">Confirmation threshold = 3 failed cycles and aging threshold = 5 clean cycles are illustrative — the standard's own worked example uses 40 warm-up cycles.</text>

  <!-- Operation Cycle row -->
  <text x="20" y="76" font-size="9" font-weight="bold" fill="#263238">Operation</text>
  <text x="20" y="87" font-size="9" font-weight="bold" fill="#263238">Cycle</text>
  <rect x="150" y="65" width="110" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="205" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Cycle 1</text>
  <rect x="260" y="65" width="110" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="315" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Cycle 2</text>
  <rect x="370" y="65" width="110" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="425" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Cycle 3</text>
  <rect x="480" y="65" width="260" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="610" y="85" text-anchor="middle" font-size="8.5" fill="#263238">Cycles 4–7 — no failures (aging)</text>
  <rect x="740" y="65" width="120" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="800" y="78" text-anchor="middle" font-size="9" fill="#263238">Cycle 8</text>
  <text x="800" y="89" text-anchor="middle" font-size="7" fill="#263238">(aging threshold met)</text>
  <text x="150" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">start</text>
  <text x="740" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="945" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">…</text>

  <!-- bit 0 -->
  <text x="20" y="131" font-size="9" font-weight="bold" fill="#c2185b">bit 0</text>
  <text x="20" y="142" font-size="8" fill="#c2185b">testFailed</text>
  <line x1="150" y1="150" x2="950" y2="150" stroke="#eceff1"/>
  <polyline points="150,150 192,150 192,120 230,120 230,150 300,150 300,120 340,120 340,150 410,150 410,120 450,120 450,150 950,150" fill="none" stroke="#c2185b" stroke-width="2.5"/>

  <!-- bit 3 -->
  <text x="20" y="176" font-size="9" font-weight="bold" fill="#1565c0">bit 3</text>
  <text x="20" y="187" font-size="8" fill="#1565c0">confirmedDTC</text>
  <line x1="150" y1="195" x2="950" y2="195" stroke="#eceff1"/>
  <polyline points="150,195 410,195 410,165 860,165 860,195 950,195" fill="none" stroke="#1565c0" stroke-width="2.5"/>

  <!-- DTCAgingCounter -->
  <text x="20" y="270" font-size="9" font-weight="bold" fill="#00838f">DTCAging</text>
  <text x="20" y="281" font-size="9" font-weight="bold" fill="#00838f">Counter</text>
  <line x1="150" y1="250" x2="950" y2="250" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="253" text-anchor="end" font-size="8" fill="#90a4ae">threshold = 5</text>
  <line x1="150" y1="310" x2="950" y2="310" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="313" text-anchor="end" font-size="8" fill="#90a4ae">0</text>
  <polyline points="150,310 480,310 545,310 545,298 610,298 610,286 675,286 675,274 740,274 740,262 860,262 860,250 950,250" fill="none" stroke="#00838f" stroke-width="2.5"/>
  <circle cx="545" cy="298" r="3" fill="#00838f"/>
  <circle cx="610" cy="286" r="3" fill="#00838f"/>
  <circle cx="675" cy="274" r="3" fill="#00838f"/>
  <circle cx="740" cy="262" r="3" fill="#00838f"/>
  <circle cx="860" cy="250" r="3" fill="#00838f"/>
  <text x="545" y="293" text-anchor="middle" font-size="7" fill="#00838f">1</text>
  <text x="610" y="281" text-anchor="middle" font-size="7" fill="#00838f">2</text>
  <text x="675" y="269" text-anchor="middle" font-size="7" fill="#00838f">3</text>
  <text x="740" y="257" text-anchor="middle" font-size="7" fill="#00838f">4</text>
  <text x="820" y="245" text-anchor="middle" font-size="7" fill="#00838f">+1 per clean cycle</text>

  <!-- bit 5 -->
  <text x="20" y="331" font-size="9" font-weight="bold" fill="#2e7d32">bit 5</text>
  <text x="20" y="342" font-size="7" fill="#2e7d32">testFailedSince</text>
  <text x="20" y="351" font-size="7" fill="#2e7d32">LastClear</text>
  <line x1="150" y1="360" x2="950" y2="360" stroke="#eceff1"/>
  <polyline points="150,360 192,360 192,330 860,330" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <polyline points="860,330 950,330" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="905" y="322" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32" opacity="0.7">?</text>

  <!-- markers -->
  <line x1="192" y1="108" x2="192" y2="360" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="192" cy="108" r="9" fill="#f26f21"/>
  <text x="192" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="300" y1="108" x2="300" y2="360" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="300" cy="108" r="9" fill="#f26f21"/>
  <text x="300" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <line x1="410" y1="108" x2="410" y2="360" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="410" cy="108" r="9" fill="#f26f21"/>
  <text x="410" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <line x1="860" y1="108" x2="860" y2="360" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="860" cy="108" r="9" fill="#f26f21"/>
  <text x="860" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">4</text>

  <!-- legend -->
  <circle cx="28" cy="396" r="8" fill="#f26f21"/>
  <text x="28" y="399" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="400" font-size="9.5" fill="#263238">Test fails the 1st time — bit 0 pulses 0→1→0; bit 5 latches 0→1 in the same instant and never resets on its own</text>

  <circle cx="28" cy="418" r="8" fill="#f26f21"/>
  <text x="28" y="421" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="422" font-size="9.5" fill="#263238">Test fails a 2nd time — bit 0 pulses again; confirmation threshold (3) not yet met, so bit 3 stays 0</text>

  <circle cx="28" cy="440" r="8" fill="#f26f21"/>
  <text x="28" y="443" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="444" font-size="9.5" fill="#263238">Test fails a 3rd time — confirmation threshold reached: bit 3 sets 0→1 in the same instant, and DTCAgingCounter resets to 0</text>

  <circle cx="28" cy="462" r="8" fill="#f26f21"/>
  <text x="28" y="465" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">4</text>
  <text x="44" y="466" font-size="9.5" fill="#263238">DTCAgingCounter increments +1 at the end of each subsequent clean cycle; on reaching its threshold, bit 3 resets 1→0</text>

  <text x="20" y="492" font-size="9.5" fill="#607d8b">confirmedDTC does not require testFailed to still be 1 — a DTC stays confirmed while the fault is currently absent [Table D.6].</text>
  <text x="20" y="508" font-size="9.5" fill="#607d8b">Whether testFailedSinceLastClear resets when the aging threshold is met is unspecified — "the responsibility of the vehicle manufacturer" [Table D.8; Figure D.11, key 7].</text>
  <text x="20" y="530" font-size="8.5" fill="#90a4ae">Simplified from Figure D.11 (Annex D.7) — the real figure also tracks bits 1, 2, 4 and 6, and uses a confirmation threshold of 1 with a 40-cycle aging threshold.</text>
</svg>
