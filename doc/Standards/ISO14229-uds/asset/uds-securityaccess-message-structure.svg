<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">SecurityAccess — seed and key exchange, A_Data structure (Clause 9.4.2 / 9.4.3, Tables 40, 41 and 44)</text>
  <text x="20" y="48" font-size="10.5" fill="#607d8b">Two request/response pairs. requestSeed values are always odd; the matching sendKey value is requestSeed + 1 (Clause 9.4.2.2).</text>

  <!-- Step 1: requestSeed -->
  <text x="40" y="74" font-size="9.5" font-weight="bold" fill="#f26f21">Step 1 — requestSeed · client → server (Table 40)</text>
  <rect x="40" y="80" width="170" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SecurityAccess Request SID</text>
  <text x="125" y="110" text-anchor="middle" font-size="9.5" fill="#263238">0x27</text>
  <text x="125" y="121" text-anchor="middle" font-size="8" fill="#607d8b">SA · M</text>

  <rect x="220" y="80" width="250" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="345" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">sub-function = securityAccessType</text>
  <text x="345" y="110" text-anchor="middle" font-size="9.5" fill="#263238">0x01, 0x03, 0x05, 0x07 – 0x7D</text>
  <text x="345" y="121" text-anchor="middle" font-size="8" fill="#607d8b">LEV_SAT_RSD · M — odd values</text>

  <rect x="480" y="80" width="430" height="46" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="695" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">securityAccessDataRecord — bytes #3 … #n</text>
  <text x="695" y="110" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0xFF</text>
  <text x="695" y="121" text-anchor="middle" font-size="8" fill="#607d8b">SECACCDR_ · U — optional, e.g. an identification of the client verified in the server (Table 43)</text>

  <!-- Step 1 response: seed -->
  <text x="40" y="142" font-size="9.5" font-weight="bold" fill="#2e7d32">server → client · the seed (Table 44)</text>
  <rect x="40" y="148" width="170" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SecurityAccess Response SID</text>
  <text x="125" y="178" text-anchor="middle" font-size="9.5" fill="#263238">0x67</text>
  <text x="125" y="189" text-anchor="middle" font-size="8" fill="#607d8b">SAPR · M</text>

  <rect x="220" y="148" width="250" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="345" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">securityAccessType — echo of bits 6-0</text>
  <text x="345" y="178" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0x7F</text>
  <text x="345" y="189" text-anchor="middle" font-size="8" fill="#607d8b">M (Table 45)</text>

  <rect x="480" y="148" width="430" height="46" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="695" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">securitySeed — seed#1 (high byte) … seed#m (low byte), bytes #3 … #n</text>
  <text x="695" y="178" text-anchor="middle" font-size="9.5" fill="#263238">If locked: non-zero; if already unlocked: 0x00 0x00 ... (all zeros)</text>
  <text x="695" y="189" text-anchor="middle" font-size="8" fill="#607d8b">SECSEED_ · C — present when the request asked for the seed</text>

  <!-- Step 2: sendKey -->
  <text x="40" y="210" font-size="9.5" font-weight="bold" fill="#f26f21">Step 2 — sendKey · client → server (Table 41)</text>
  <rect x="40" y="216" width="170" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="233" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SecurityAccess Request SID</text>
  <text x="125" y="246" text-anchor="middle" font-size="9.5" fill="#263238">0x27</text>
  <text x="125" y="257" text-anchor="middle" font-size="8" fill="#607d8b">SA · M</text>

  <rect x="220" y="216" width="250" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="345" y="233" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">sub-function = securityAccessType</text>
  <text x="345" y="246" text-anchor="middle" font-size="9.5" fill="#263238">0x02, 0x04, 0x06, 0x08 – 0x7E</text>
  <text x="345" y="257" text-anchor="middle" font-size="8" fill="#607d8b">LEV_SAT_SK · M — requestSeed + 1</text>

  <rect x="480" y="216" width="430" height="46" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="695" y="233" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">securityKey — key#1 (high byte) … key#m (low byte), bytes #3 … #n</text>
  <text x="695" y="246" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0xFF</text>
  <text x="695" y="257" text-anchor="middle" font-size="8" fill="#607d8b">SECKEY_ · M — generated by the security algorithm from the seed (Table 43)</text>

  <!-- Step 2 response -->
  <text x="40" y="278" font-size="9.5" font-weight="bold" fill="#2e7d32">server → client · unlocked (Table 44)</text>
  <rect x="40" y="284" width="170" height="46" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="301" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">SecurityAccess Response SID</text>
  <text x="125" y="314" text-anchor="middle" font-size="9.5" fill="#263238">0x67</text>
  <text x="125" y="325" text-anchor="middle" font-size="8" fill="#607d8b">SAPR · M</text>

  <rect x="220" y="284" width="250" height="46" fill="#fff3e0" stroke="#f26f21"/>
  <text x="345" y="301" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">securityAccessType — echo of bits 6-0</text>
  <text x="345" y="314" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0x7F</text>
  <text x="345" y="325" text-anchor="middle" font-size="8" fill="#607d8b">M (Table 45)</text>

  <rect x="480" y="284" width="430" height="46" fill="#eceff1" stroke="#90a4ae"/>
  <text x="695" y="303" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">no securitySeed</text>
  <text x="695" y="318" text-anchor="middle" font-size="8.5" fill="#607d8b">the seed bytes appear only in the response to a requestSeed sub-function (Table 45)</text>

  <text x="20" y="350" font-size="10" fill="#263238">Seed interpretation: NON-ZERO seed = security level is locked and must be unlocked via sendKey. ALL-ZERO seed (0x00 00 00...) = security level is already unlocked (no key needed).</text>
  <text x="20" y="364" font-size="10" fill="#263238">The server shall never send a non-zero seed for an already-unlocked level (Clause 9.4.1).</text>

  <text x="480" y="385" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Worked example — level 0x01, seed 0x3657, key 0xC9A9 (Clause 9.4.5.1)</text>

  <rect x="40" y="393" width="200" height="34" fill="#fff3e0" stroke="#f26f21"/>
  <text x="140" y="408" text-anchor="middle" font-size="11" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">27 01</text>
  <text x="140" y="421" text-anchor="middle" font-size="8" fill="#607d8b">requestSeed</text>

  <rect x="260" y="393" width="200" height="34" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="360" y="408" text-anchor="middle" font-size="11" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">67 01 36 57</text>
  <text x="360" y="421" text-anchor="middle" font-size="8" fill="#607d8b">seed = 0x3657</text>

  <rect x="480" y="393" width="200" height="34" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="580" y="408" text-anchor="middle" font-size="11" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">27 02 C9 A9</text>
  <text x="580" y="421" text-anchor="middle" font-size="8" fill="#607d8b">sendKey, key = 0xC9A9</text>

  <rect x="700" y="393" width="210" height="34" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="805" y="408" text-anchor="middle" font-size="11" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">67 02</text>
  <text x="805" y="421" text-anchor="middle" font-size="8" fill="#607d8b">key valid — level unlocked</text>

  <text x="20" y="447" font-size="10" fill="#263238">Only one security level is active at a time: unlocking a new level deactivates whatever was unlocked before. An invalid key restarts the sequence from requestSeed (Clause 9.4.1, Annex I).</text>
</svg>
