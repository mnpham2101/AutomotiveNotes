<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="980" height="460" fill="#ffffff"/>

  <text x="490" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">testNotCompletedThisOperationCycle (bit 6) — adapted from Annex D.6, Figure D.10 and D.2.4, Figure D.9</text>
  <text x="20" y="42" font-size="10.5" fill="#607d8b">Bit 6 clears the instant the counter first reaches either extreme in a cycle — that's what "the test ran to completion" means.</text>

  <!-- Operation Cycle row -->
  <text x="20" y="76" font-size="9" font-weight="bold" fill="#263238">Operation</text>
  <text x="20" y="87" font-size="9" font-weight="bold" fill="#263238">Cycle</text>
  <rect x="150" y="65" width="430" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="365" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 1</text>
  <rect x="580" y="65" width="340" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="750" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 2</text>
  <text x="150" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">start</text>
  <text x="580" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="945" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">…</text>

  <!-- Fault Detection Counter row -->
  <text x="20" y="152" font-size="9" font-weight="bold" fill="#263238">Fault</text>
  <text x="20" y="163" font-size="9" font-weight="bold" fill="#263238">Detection</text>
  <text x="20" y="174" font-size="9" font-weight="bold" fill="#263238">Counter</text>

  <line x1="150" y1="115" x2="920" y2="115" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="118" text-anchor="end" font-size="8" fill="#90a4ae">+127 (max)</text>
  <line x1="150" y1="160" x2="920" y2="160" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="163" text-anchor="end" font-size="8" fill="#90a4ae">0</text>
  <line x1="150" y1="205" x2="920" y2="205" stroke="#cfd8dc" stroke-dasharray="3 3"/>
  <text x="140" y="208" text-anchor="end" font-size="8" fill="#90a4ae">minimum</text>

  <polyline points="150,160 220,160 220,145 290,145 290,130 360,130 360,115 430,115 430,130 500,130 500,145 580,145 580,160 650,160 650,175 720,175 720,190 790,190 790,205 920,205" fill="none" stroke="#00838f" stroke-width="2.5"/>
  <circle cx="360" cy="115" r="4" fill="#00838f"/>
  <circle cx="580" cy="160" r="4" fill="#00838f"/>
  <circle cx="790" cy="205" r="4" fill="#00838f"/>

  <!-- testFailed bit 0 -->
  <text x="20" y="235" font-size="9" font-weight="bold" fill="#c2185b">bit 0</text>
  <text x="20" y="246" font-size="8" fill="#c2185b">testFailed</text>
  <line x1="150" y1="255" x2="920" y2="255" stroke="#eceff1"/>
  <polyline points="150,255 360,255 360,225 790,225 790,255 920,255" fill="none" stroke="#c2185b" stroke-width="2.5"/>

  <!-- testNotCompletedThisOperationCycle bit 6 -->
  <text x="20" y="303" font-size="9" font-weight="bold" fill="#5e35b1">bit 6</text>
  <text x="20" y="314" font-size="7" fill="#5e35b1">testNotCompleted</text>
  <text x="20" y="323" font-size="7" fill="#5e35b1">ThisOperationCycle</text>
  <line x1="150" y1="330" x2="920" y2="330" stroke="#eceff1"/>
  <polyline points="150,300 360,300 360,330 580,330 580,300 790,300 790,330 920,330" fill="none" stroke="#5e35b1" stroke-width="2.5"/>

  <!-- markers -->
  <line x1="360" y1="108" x2="360" y2="330" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="360" cy="108" r="9" fill="#f26f21"/>
  <text x="360" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="580" y1="108" x2="580" y2="330" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="580" cy="108" r="9" fill="#f26f21"/>
  <text x="580" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <line x1="790" y1="108" x2="790" y2="330" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="790" cy="108" r="9" fill="#f26f21"/>
  <text x="790" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <!-- legend -->
  <circle cx="28" cy="358" r="8" fill="#f26f21"/>
  <text x="28" y="361" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="362" font-size="9.5" fill="#263238">Counter reaches +127 (max) — the test just completed with a failed result: bit 0 sets 0→1 and bit 6 clears 1→0 together</text>

  <circle cx="28" cy="380" r="8" fill="#f26f21"/>
  <text x="28" y="383" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="384" font-size="9.5" fill="#263238">Cycle 1 stops / Cycle 2 starts — the counter also resets to 0, same as bit 6 → 1, for the new cycle's not-yet-run test [key 8]; bit 0 stays retained</text>

  <circle cx="28" cy="402" r="8" fill="#f26f21"/>
  <text x="28" y="405" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="406" font-size="9.5" fill="#263238">Counter reaches its minimum for the first time this cycle — same corroboration, now for a passed result: bit 0 resets 1→0 and bit 6 clears 1→0 together</text>

  <text x="20" y="432" font-size="9.5" fill="#607d8b">Reaching either extreme is what "ran to completion" means — bit 6 doesn't care whether the result was a pass or a fail, only that a result exists.</text>
  <text x="20" y="448" font-size="8.5" fill="#90a4ae">Simplified — combines Annex D.6, Figure D.10 (keys 1, 3, 9) with Annex D.2.4, Figure D.9 (keys 9–12); whether testFailed is retained across the cycle boundary is manufacturer specific.</text>
</svg>
