<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">Server-client security exchange — SecurityAccess seed/key sequence (Clause 9.4.1)</text>
  <text x="20" y="46" font-size="10.5" fill="#607d8b">If the level is already unlocked, requestSeed returns an all-zero seed and no key exchange is needed; an invalid key requires restarting from requestSeed (Annex I).</text>

  <!-- Lifeline heads -->
  <rect x="40" y="62" width="170" height="36" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Client (tester)</text>

  <rect x="620" y="62" width="170" height="36" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="705" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Server (ECU)</text>

  <!-- Lifelines -->
  <line x1="125" y1="98" x2="125" y2="608" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <line x1="705" y1="98" x2="705" y2="608" stroke="#90a4ae" stroke-dasharray="4 3"/>

  <!-- 1: requestSeed -->
  <text x="135" y="118" font-size="10.5" font-weight="bold" fill="#1565c0">1  requestSeed</text>
  <text x="135" y="130" font-size="8.5" fill="#607d8b">client → server · SID 0x27, sub-function = securityAccessType (odd) [Clause 9.4.2.1, Table 40]</text>
  <line x1="125" y1="142" x2="705" y2="142" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- alt frame A: already-unlocked check -->
  <rect x="40" y="160" width="880" height="164" fill="none" stroke="#90a4ae" stroke-dasharray="4 3" stroke-width="1.2"/>
  <rect x="40" y="160" width="54" height="20" fill="#eceff1" stroke="#90a4ae"/>
  <text x="67" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#455a64">alt</text>
  <text x="104" y="174" font-size="9.5" font-style="italic" fill="#455a64">[security level already unlocked]</text>

  <!-- 2a: positive response, seed = 0 -->
  <text x="135" y="198" font-size="10.5" font-weight="bold" fill="#2e7d32">2a  positive response — seed = 0x00 00 (all-zero)</text>
  <text x="135" y="210" font-size="8.5" fill="#607d8b">server → client · SID 0x67 &lt;type&gt; &lt;securitySeed&gt; — value is all-zero because the level is already unlocked [Clause 9.4.1]</text>
  <line x1="705" y1="224" x2="125" y2="224" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>
  <text x="135" y="238" font-size="8.5" font-style="italic" fill="#607d8b">Level already unlocked → sequence ends here; client does not need to send sendKey.</text>

  <!-- divider -->
  <line x1="40" y1="262" x2="920" y2="262" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="104" y="250" font-size="9.5" font-style="italic" fill="#455a64">[else — security level currently locked]</text>

  <!-- 2b: positive response, non-zero seed -->
  <text x="135" y="278" font-size="10.5" font-weight="bold" fill="#2e7d32">2b  positive response — seed (non-zero)</text>
  <text x="135" y="290" font-size="8.5" fill="#607d8b">server → client · SID 0x67 &lt;type&gt; &lt;securitySeed&gt; — non-zero value; level is locked [Clause 9.4.3.1, Table 44]</text>
  <line x1="705" y1="304" x2="125" y2="304" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>

  <!-- 3: sendKey (continues on the locked path) -->
  <text x="135" y="340" font-size="10.5" font-weight="bold" fill="#5e35b1">3  sendKey</text>
  <text x="135" y="352" font-size="8.5" fill="#607d8b">client → server · SID 0x27 &lt;type+1&gt; &lt;securityKey&gt; [Clause 9.4.2.1, Table 41]</text>
  <line x1="125" y1="366" x2="705" y2="366" stroke="#5e35b1" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

  <!-- 4: self compare on server -->
  <path d="M 705 382 C 760 382 760 424 705 424" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#arrowGrey)"/>
  <text x="770" y="388" font-size="10" font-weight="bold" fill="#455a64">4  [self] compare key</text>
  <text x="770" y="400" font-size="8.5" fill="#607d8b">vs. internally stored / calculated value;</text>
  <text x="770" y="411" font-size="8.5" fill="#607d8b">confirm validity and unlock client's</text>
  <text x="770" y="422" font-size="8.5" fill="#607d8b">access for that security level</text>

  <!-- alt frame B: key validity -->
  <rect x="40" y="444" width="880" height="148" fill="none" stroke="#90a4ae" stroke-dasharray="4 3" stroke-width="1.2"/>
  <rect x="40" y="444" width="54" height="20" fill="#eceff1" stroke="#90a4ae"/>
  <text x="67" y="458" text-anchor="middle" font-size="10" font-weight="bold" fill="#455a64">alt</text>
  <text x="104" y="458" font-size="9.5" font-style="italic" fill="#c62828">[key invalid — false access attempt]</text>

  <!-- 5a: negative response -->
  <text x="135" y="474" font-size="10.5" font-weight="bold" fill="#c62828">5a  negative response</text>
  <text x="135" y="486" font-size="8.5" fill="#607d8b">server → client · NRC 0x7F 0x27 &lt;NRC&gt; [Clause 9.4.4, Table 46]</text>
  <line x1="705" y1="500" x2="125" y2="500" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>

  <!-- divider -->
  <line x1="40" y1="530" x2="920" y2="530" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="104" y="518" font-size="9.5" font-style="italic" fill="#2e7d32">[else — key confirmed valid]</text>

  <!-- 5b: positive response, unlocked -->
  <text x="135" y="546" font-size="10.5" font-weight="bold" fill="#2e7d32">5b  positive response (posRes)</text>
  <text x="135" y="558" font-size="8.5" fill="#607d8b">server → client · SID 0x67 &lt;type&gt;, no seed bytes [Clause 9.4.3.1, Table 44]</text>
  <line x1="705" y1="572" x2="125" y2="572" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>

  <text x="20" y="624" font-size="10" fill="#263238">An invalid key requires the client to restart the whole sequence from requestSeed (Clause 9.4.1, Annex I). Only one security level is</text>
  <text x="20" y="638" font-size="10" fill="#263238">active at a time — unlocking a new level deactivates whichever level was unlocked before (Clause 9.4.1).</text>

</svg>
