<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">Server-client security exchange — SecurityAccess seed/key sequence (Clause 9.4.1)</text>
  <text x="20" y="46" font-size="10.5" fill="#607d8b">Two request/response pairs unlock one security level; an invalid key requires the client to restart from requestSeed (Annex I).</text>

  <!-- Lifeline heads -->
  <rect x="40" y="62" width="170" height="36" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="125" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Client (tester)</text>

  <rect x="620" y="62" width="170" height="36" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="705" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Server (ECU)</text>

  <!-- Lifelines -->
  <line x1="125" y1="98" x2="125" y2="560" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <line x1="705" y1="98" x2="705" y2="560" stroke="#90a4ae" stroke-dasharray="4 3"/>

  <!-- 1: requestSeed -->
  <text x="135" y="118" font-size="10.5" font-weight="bold" fill="#1565c0">1  requestSeed</text>
  <text x="135" y="130" font-size="8.5" fill="#607d8b">client → server · SID 0x27, sub-function = securityAccessType (odd) [Clause 9.4.2.1, Table 40]</text>
  <line x1="125" y1="142" x2="705" y2="142" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- 2: seed positive response -->
  <text x="135" y="168" font-size="10.5" font-weight="bold" fill="#2e7d32">2  positive response — seed</text>
  <text x="135" y="180" font-size="8.5" fill="#607d8b">server → client · SID 0x67 &lt;type&gt; &lt;securitySeed&gt; [Clause 9.4.3.1, Table 44]</text>
  <line x1="705" y1="192" x2="125" y2="192" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>

  <!-- 3: sendKey -->
  <text x="135" y="218" font-size="10.5" font-weight="bold" fill="#5e35b1">3  sendKey</text>
  <text x="135" y="230" font-size="8.5" fill="#607d8b">client → server · SID 0x27 &lt;type+1&gt; &lt;securityKey&gt; [Clause 9.4.2.1, Table 41]</text>
  <line x1="125" y1="242" x2="705" y2="242" stroke="#5e35b1" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

  <!-- 4: self compare on server -->
  <path d="M 705 258 C 760 258 760 300 705 300" fill="none" stroke="#455a64" stroke-width="1.4" marker-end="url(#arrowGrey)"/>
  <text x="770" y="264" font-size="10" font-weight="bold" fill="#455a64">4  [self] compare key</text>
  <text x="770" y="276" font-size="8.5" fill="#607d8b">vs. internally stored / calculated value;</text>
  <text x="770" y="287" font-size="8.5" fill="#607d8b">confirm validity and unlock client's</text>
  <text x="770" y="298" font-size="8.5" fill="#607d8b">access for that security level</text>

  <!-- alt frame -->
  <rect x="40" y="320" width="880" height="220" fill="none" stroke="#90a4ae" stroke-dasharray="4 3" stroke-width="1.2"/>
  <rect x="40" y="320" width="54" height="20" fill="#eceff1" stroke="#90a4ae"/>
  <text x="67" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#455a64">alt</text>
  <text x="104" y="334" font-size="9.5" font-style="italic" fill="#c62828">[key invalid — false access attempt]</text>

  <!-- 5a: negative response -->
  <text x="135" y="358" font-size="10.5" font-weight="bold" fill="#c62828">5a  negative response</text>
  <text x="135" y="370" font-size="8.5" fill="#607d8b">server → client · NRC 0x7F 0x27 &lt;NRC&gt; [Clause 9.4.4, Table 46]</text>
  <line x1="705" y1="382" x2="125" y2="382" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>

  <!-- divider -->
  <line x1="40" y1="406" x2="920" y2="406" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="104" y="401" font-size="9.5" font-style="italic" fill="#2e7d32">[else — key confirmed valid]</text>

  <!-- 5b: positive response, unlocked -->
  <text x="135" y="424" font-size="10.5" font-weight="bold" fill="#2e7d32">5b  positive response (posRes)</text>
  <text x="135" y="436" font-size="8.5" fill="#607d8b">server → client · SID 0x67 &lt;type&gt;, no seed bytes [Clause 9.4.3.1, Table 44]</text>
  <line x1="705" y1="450" x2="125" y2="450" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>

  <!-- note -->
  <path d="M 580 465 L 860 465 L 880 485 L 880 525 L 580 525 Z" fill="#fff3e0" stroke="#f26f21"/>
  <path d="M 860 465 L 860 485 L 880 485 Z" fill="#ffe0b2" stroke="#f26f21"/>
  <text x="595" y="484" font-size="9.5" font-weight="bold" fill="#e65100">seed value = 0x00 00</text>
  <text x="595" y="498" font-size="8.5" fill="#263238">embedded in posRes, for the security</text>
  <text x="595" y="510" font-size="8.5" fill="#263238">level now unlocked [Clause 9.4.1]</text>

  <text x="20" y="562" font-size="10" fill="#263238">An invalid key requires the client to restart the whole sequence from requestSeed (Clause 9.4.1, Annex I). Only one security level is</text>
  <text x="20" y="576" font-size="10" fill="#263238">active at a time — unlocking a new level deactivates whichever level was unlocked before (Clause 9.4.1).</text>

</svg>
