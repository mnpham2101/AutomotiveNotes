<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <text x="480" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">pendingDTC vs testFailedSinceLastClear — simplified from Annex D.2.3, Table D.5</text>
  <text x="20" y="42" font-size="10.5" fill="#607d8b">Same 4 bits share a set trigger, but bit 2 self-clears after one clean cycle while bit 5 never does.</text>

  <!-- Operation Cycle row -->
  <text x="20" y="76" font-size="9" font-weight="bold" fill="#263238">Operation</text>
  <text x="20" y="87" font-size="9" font-weight="bold" fill="#263238">Cycle</text>
  <rect x="150" y="65" width="370" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="335" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 1</text>
  <rect x="520" y="65" width="260" height="32" fill="#e8eaf6" stroke="#1565c0"/>
  <text x="650" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Operation Cycle 2</text>
  <rect x="780" y="65" width="140" height="32" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="850" y="85" text-anchor="middle" font-size="9.5" fill="#263238">Cycle 3</text>
  <text x="150" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">start</text>
  <text x="520" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="780" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">stop / start</text>
  <text x="920" y="60" text-anchor="middle" font-size="8" fill="#90a4ae">…</text>

  <!-- bit 0 -->
  <text x="20" y="131" font-size="9" font-weight="bold" fill="#c2185b">bit 0</text>
  <text x="20" y="142" font-size="8" fill="#c2185b">testFailed</text>
  <line x1="150" y1="150" x2="920" y2="150" stroke="#eceff1"/>
  <polyline points="150,150 280,150 280,120 360,120 360,150 920,150" fill="none" stroke="#c2185b" stroke-width="2.5"/>

  <!-- bit 1 -->
  <text x="20" y="172" font-size="9" font-weight="bold" fill="#5e35b1">bit 1</text>
  <text x="20" y="182" font-size="7" fill="#5e35b1">testFailedThis</text>
  <text x="20" y="191" font-size="7" fill="#5e35b1">OperationCycle</text>
  <line x1="150" y1="195" x2="920" y2="195" stroke="#eceff1"/>
  <polyline points="150,195 280,195 280,165 520,165 520,195 920,195" fill="none" stroke="#5e35b1" stroke-width="2.5"/>

  <!-- bit 2 -->
  <text x="20" y="222" font-size="9" font-weight="bold" fill="#1565c0">bit 2</text>
  <text x="20" y="233" font-size="8" fill="#1565c0">pendingDTC</text>
  <line x1="150" y1="240" x2="920" y2="240" stroke="#eceff1"/>
  <polyline points="150,240 280,240 280,210 780,210 780,240 920,240" fill="none" stroke="#1565c0" stroke-width="2.5"/>

  <!-- bit 5 -->
  <text x="20" y="262" font-size="9" font-weight="bold" fill="#2e7d32">bit 5</text>
  <text x="20" y="272" font-size="7" fill="#2e7d32">testFailedSince</text>
  <text x="20" y="281" font-size="7" fill="#2e7d32">LastClear</text>
  <line x1="150" y1="285" x2="920" y2="285" stroke="#eceff1"/>
  <polyline points="150,285 280,285 280,255 920,255" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- markers -->
  <line x1="280" y1="108" x2="280" y2="285" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="280" cy="108" r="9" fill="#f26f21"/>
  <text x="280" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="360" y1="108" x2="360" y2="285" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="360" cy="108" r="9" fill="#f26f21"/>
  <text x="360" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <line x1="520" y1="108" x2="520" y2="285" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="520" cy="108" r="9" fill="#f26f21"/>
  <text x="520" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <line x1="780" y1="108" x2="780" y2="285" stroke="#f26f21" stroke-dasharray="2 3" stroke-width="1"/>
  <circle cx="780" cy="108" r="9" fill="#f26f21"/>
  <text x="780" y="111" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">4</text>

  <!-- legend -->
  <circle cx="28" cy="311" r="8" fill="#f26f21"/>
  <text x="28" y="314" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">1</text>
  <text x="44" y="315" font-size="9.5" fill="#263238">Test fails — bits 0, 1, 2 and 5 all set 0 → 1: pendingDTC and testFailedThisOperationCycle share the same set condition</text>

  <circle cx="28" cy="331" r="8" fill="#f26f21"/>
  <text x="28" y="334" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">2</text>
  <text x="44" y="335" font-size="9.5" fill="#263238">Test passes — bit 0 resets 1 → 0 immediately; bits 1, 2 and 5 are untouched</text>

  <circle cx="28" cy="351" r="8" fill="#f26f21"/>
  <text x="28" y="354" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">3</text>
  <text x="44" y="355" font-size="9.5" fill="#263238">Cycle 1 stops — bit 1 resets 1 → 0 (cycle-scoped), but bit 2 stays 1: that cycle wasn't clean</text>

  <circle cx="28" cy="371" r="8" fill="#f26f21"/>
  <text x="28" y="374" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">4</text>
  <text x="44" y="375" font-size="9.5" fill="#263238">Cycle 2 stops with zero failures (bit 1 stayed 0 throughout) — only now does bit 2 reset 1 → 0</text>

  <text x="20" y="402" font-size="9.5" fill="#607d8b">bit 5 never resets on its own; bit 2 resets automatically, but only after one full clean operation cycle [Annex D.2.3, Table D.5].</text>
  <text x="20" y="418" font-size="8.5" fill="#90a4ae">Simplified — the real Table D.5 pseudocode also requires testNotCompletedThisOperationCycle == 0 (the test actually ran to completion).</text>
</svg>
