<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="260" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">ClearDiagnosticInformation (0x14) — request and positive response (Clause 11.2, Tables 250, 252)</text>
  <text x="20" y="48" font-size="10.5" fill="#607d8b">Request = 0x14 plus a 3-byte groupOfDTC; there is no sub-function byte. The positive response is the SID alone — no data-parameters at all.</text>

  <!-- Request -->
  <text x="40" y="76" font-size="9.5" font-weight="bold" fill="#f26f21">Request — client → server (Table 250)</text>
  <rect x="40" y="82" width="140" height="50" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="110" y="100" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">ClearDiagnosticInformation</text>
  <text x="110" y="114" text-anchor="middle" font-size="9.5" fill="#263238">0x14</text>
  <text x="110" y="126" text-anchor="middle" font-size="8" fill="#607d8b">CDTCI · M — A_Data byte #1</text>

  <rect x="200" y="82" width="340" height="50" fill="#fff3e0" stroke="#f26f21"/>
  <text x="370" y="100" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">groupOfDTC [ HighByte, MiddleByte, LowByte ]</text>
  <text x="370" y="114" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0xFF each</text>
  <text x="370" y="126" text-anchor="middle" font-size="8" fill="#607d8b">GODTC_ · M — A_Data bytes #2–#4</text>

  <!-- Response -->
  <text x="40" y="158" font-size="9.5" font-weight="bold" fill="#2e7d32">Positive response — server → client (Table 252)</text>
  <rect x="40" y="164" width="140" height="50" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="110" y="182" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">ClearDiagnosticInformation</text>
  <text x="110" y="196" text-anchor="middle" font-size="9.5" fill="#263238">0x54</text>
  <text x="110" y="208" text-anchor="middle" font-size="8" fill="#607d8b">CDTCIPR · M — A_Data byte #1</text>

  <rect x="200" y="164" width="340" height="50" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <text x="370" y="186" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">no data-parameters</text>
  <text x="370" y="200" text-anchor="middle" font-size="8.5" fill="#90a4ae">the SID alone is the whole response — 1 byte total</text>

  <!-- Footer -->
  <text x="20" y="238" font-size="10" fill="#263238">The server answers positively even when no DTCs are stored, and clears only the status copy used by ReadDTCInformation — the optional DTC mirror memory (11.3) is untouched (Clause 11.2.1).</text>
  <text x="20" y="252" font-size="10" fill="#263238">Example (Tables 254–255): 14 FF FF 33 — clear the "Emissions-related systems" group → positive response 54.</text>
</svg>
