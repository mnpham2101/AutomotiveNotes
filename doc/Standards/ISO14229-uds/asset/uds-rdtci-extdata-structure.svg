<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="300" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">ReadDTCInformation 0x06 — reportDTCExtDataRecordByDTCNumber (Clause 11.3.2 / 11.3.3, Table 276)</text>
  <text x="20" y="46" font-size="10.5" fill="#607d8b">One DTC in (DTCMaskRecord); DTC+status echoed once, then a record repeats per DTCExtDataRecordNumber returned.</text>

  <!-- Request -->
  <text x="20" y="68" font-size="10" font-weight="bold" fill="#f26f21">Request (Table 259) — names one DTC and one record (or 0xFE/0xFF for all)</text>
  <rect x="20" y="74" width="70" height="38" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="55" y="97" text-anchor="middle" font-size="9" fill="#263238">0x19</text>
  <rect x="96" y="74" width="110" height="38" fill="#fff3e0" stroke="#f26f21"/>
  <text x="151" y="97" text-anchor="middle" font-size="9" fill="#263238">reportType 0x06</text>
  <rect x="212" y="74" width="180" height="38" fill="#fce4ec" stroke="#c2185b"/>
  <text x="302" y="97" text-anchor="middle" font-size="8.5" fill="#263238">DTCMaskRecord [ HB, MB, LB ]</text>
  <rect x="398" y="74" width="200" height="38" fill="#e0f7fa" stroke="#00838f"/>
  <text x="498" y="90" text-anchor="middle" font-size="8" fill="#263238">DTCExtDataRecordNumber</text>
  <text x="498" y="102" text-anchor="middle" font-size="7.5" fill="#607d8b">0xFE = all OBD, 0xFF = all</text>

  <!-- Response -->
  <text x="20" y="140" font-size="10" font-weight="bold" fill="#2e7d32">Positive response (Table 276)</text>
  <rect x="20" y="146" width="60" height="40" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="50" y="169" text-anchor="middle" font-size="9" fill="#263238">0x59</text>
  <rect x="84" y="146" width="80" height="40" fill="#fff3e0" stroke="#f26f21"/>
  <text x="124" y="169" text-anchor="middle" font-size="9" fill="#263238">0x06</text>
  <rect x="168" y="146" width="150" height="40" fill="#fce4ec" stroke="#c2185b"/>
  <text x="243" y="163" text-anchor="middle" font-size="8" fill="#263238">DTC +</text>
  <text x="243" y="175" text-anchor="middle" font-size="8" fill="#263238">statusOfDTC</text>

  <text x="674" y="140" text-anchor="middle" font-size="9" fill="#90a4ae">repeats once per DTCExtDataRecordNumber returned — 1 unless 0xFE/0xFF requested</text>
  <rect x="322" y="146" width="608" height="40" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="3 3"/>
  <rect x="330" y="152" width="150" height="28" fill="#e0f7fa" stroke="#00838f"/>
  <text x="405" y="170" text-anchor="middle" font-size="8" fill="#263238">DTCExtDataRecordNumber</text>
  <rect x="488" y="152" width="434" height="28" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="705" y="170" text-anchor="middle" font-size="8" fill="#263238">extendedData bytes — manufacturer-defined, not part of ISO 14229-1</text>

  <rect x="20" y="200" width="920" height="24" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="28" y="216" font-size="9" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">Example (11.3.5.8): 19 06 12 34 56 FF  →  59 06 | 12 34 56 24 | 05 17 | 10 79</text>

  <text x="20" y="242" font-size="9.5" fill="#607d8b">DTC 0x123456, status 0x24, client asked for all records (0xFF): record 0x05 (warm-up counter) = 0x17, record 0x10 (fault-detection counter) = 0x79.</text>
  <text x="20" y="260" font-size="9.5" fill="#607d8b">Unlike a DTCSnapshot record, there's no dataIdentifier here — the DTCExtDataRecordNumber itself is the label, defined manufacturer to manufacturer.</text>
</svg>
