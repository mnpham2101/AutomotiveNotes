  <!-- Footer notes -->
  <text x="20" y="358" font-size="10" fill="#263238">Here m = 17, so the request is 20 bytes: 1 (SID) + 2 (DID) + 17 (dataRecord). The same VIN is what ReadDataByIdentifier returns for 0xF190 (Table 148).</text>
  <text x="20" y="376" font-size="10" fill="#263238">Positive response is only 3 bytes — 0x6E plus the DID echo, no data (Clause 10.7.3.1, Table 233).</text>
</svg>
