<svg viewBox="0 0 960 410" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="410" fill="#ffffff"/>

  <!-- Title / subtitle -->
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">DiagnosticSessionControl positive response — A_Data structure (Clause 9.2.3.1, Table 26)</text>
  <text x="20" y="48" font-size="10.5" fill="#607d8b">Response = 0x50, the echoed diagnosticSessionType, then a 4-byte sessionParameterRecord carrying the timing parameters of the session just entered.</text>

  <!-- Byte-level labels -->
  <text x="115" y="74" text-anchor="middle" font-size="9.5" fill="#90a4ae">A_Data byte #1</text>
  <text x="295" y="74" text-anchor="middle" font-size="9.5" fill="#90a4ae">A_Data byte #2</text>
  <text x="655" y="74" text-anchor="middle" font-size="9.5" fill="#90a4ae">A_Data bytes #3 … #6</text>

  <!-- Byte-level boxes -->
  <rect x="40" y="80" width="150" height="52" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="115" y="98" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">DiagnosticSessionControl SID</text>
  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#263238">0x50</text>
  <text x="115" y="125" text-anchor="middle" font-size="8" fill="#607d8b">DSCPR · M (mandatory)</text>

  <rect x="200" y="80" width="190" height="52" fill="#fff3e0" stroke="#f26f21"/>
  <text x="295" y="98" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">diagnosticSessionType</text>
  <text x="295" y="112" text-anchor="middle" font-size="9.5" fill="#263238">0x00 – 0xFF</text>
  <text x="295" y="125" text-anchor="middle" font-size="8" fill="#607d8b">LEV_DS_ · M — echo of bits 6-0 of the request</text>

  <rect x="400" y="80" width="510" height="52" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="655" y="98" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#263238">sessionParameterRecord — 4 bytes</text>
  <text x="655" y="112" text-anchor="middle" font-size="9.5" fill="#263238">SPREC_DATA_1 … DATA_m, each 0x00 – 0xFF</text>
  <text x="655" y="125" text-anchor="middle" font-size="8" fill="#607d8b">M — session-specific parameter values reported by the server (Table 27)</text>

  <!-- Connectors down to the record expansion -->
  <line x1="400" y1="132" x2="400" y2="164" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <line x1="910" y1="132" x2="910" y2="164" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="655" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#2e7d32">sessionParameterRecord expanded (Clause 9.2.3.2, Table 28)</text>

  <!-- Record byte boxes -->
  <rect x="400" y="166" width="124" height="48" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="462" y="182" text-anchor="middle" font-size="8.5" fill="#607d8b">record byte #1</text>
  <text x="462" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">P2Server_max</text>
  <text x="462" y="208" text-anchor="middle" font-size="8.5" fill="#263238">high byte · SPREC_P2SMH</text>

  <rect x="528" y="166" width="124" height="48" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="590" y="182" text-anchor="middle" font-size="8.5" fill="#607d8b">record byte #2</text>
  <text x="590" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">P2Server_max</text>
  <text x="590" y="208" text-anchor="middle" font-size="8.5" fill="#263238">low byte · SPREC_P2SML</text>

  <rect x="656" y="166" width="124" height="48" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="718" y="182" text-anchor="middle" font-size="8.5" fill="#607d8b">record byte #3</text>
  <text x="718" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">P2*Server_max</text>
  <text x="718" y="208" text-anchor="middle" font-size="8.5" fill="#263238">high byte · SPREC_P2ESMH</text>

  <rect x="784" y="166" width="124" height="48" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="846" y="182" text-anchor="middle" font-size="8.5" fill="#607d8b">record byte #4</text>
  <text x="846" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">P2*Server_max</text>
  <text x="846" y="208" text-anchor="middle" font-size="8.5" fill="#263238">low byte · SPREC_P2ESML</text>

  <!-- Note -->
  <text x="20" y="236" font-size="10" fill="#263238">Both parameters are 2-byte unsigned values, high byte first. They are response-timing budgets for the session just activated — not the session lifetime.</text>

  <text x="20" y="252" font-size="10" font-weight="bold" fill="#263238">sessionParameterRecord content (Clause 9.2.3.2, Table 29)</text>

  <!-- Table header -->
  <rect x="40" y="260" width="110" height="24" fill="#263238"/>
  <text x="50" y="276" font-size="9.5" font-weight="bold" fill="#ffffff">Parameter</text>
  <rect x="150" y="260" width="430" height="24" fill="#263238"/>
  <text x="160" y="276" font-size="9.5" font-weight="bold" fill="#ffffff">Description</text>
  <rect x="580" y="260" width="70" height="24" fill="#263238"/>
  <text x="590" y="276" font-size="9.5" font-weight="bold" fill="#ffffff"># bytes</text>
  <rect x="650" y="260" width="90" height="24" fill="#263238"/>
  <text x="660" y="276" font-size="9.5" font-weight="bold" fill="#ffffff">Resolution</text>
  <rect x="740" y="260" width="70" height="24" fill="#263238"/>
  <text x="750" y="276" font-size="9.5" font-weight="bold" fill="#ffffff">min</text>
  <rect x="810" y="260" width="100" height="24" fill="#263238"/>
  <text x="820" y="276" font-size="9.5" font-weight="bold" fill="#ffffff">max</text>

  <!-- Row 1 -->
  <rect x="40" y="286" width="110" height="32" fill="#e8f5e9" stroke="#cfd8dc"/>
  <text x="50" y="306" font-size="9.5" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">P2Server_max</text>
  <rect x="150" y="286" width="430" height="32" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="160" y="306" font-size="9.5" fill="#263238">Default P2Server_max timing supported by the server for the activated diagnostic session</text>
  <rect x="580" y="286" width="70" height="32" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="590" y="306" font-size="9.5" fill="#263238">2</text>
  <rect x="650" y="286" width="90" height="32" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="660" y="306" font-size="9.5" fill="#263238">1 ms</text>
  <rect x="740" y="286" width="70" height="32" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="750" y="306" font-size="9.5" fill="#263238">0 ms</text>
  <rect x="810" y="286" width="100" height="32" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="820" y="306" font-size="9.5" fill="#263238">65 535 ms</text>

  <!-- Row 2 -->
  <rect x="40" y="320" width="110" height="32" fill="#ede7f6" stroke="#cfd8dc"/>
  <text x="50" y="340" font-size="9.5" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#263238">P2*Server_max</text>
  <rect x="150" y="320" width="430" height="32" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="160" y="340" font-size="9.5" fill="#263238">Enhanced (NRC 0x78) P2*Server_max supported by the server for the activated session</text>
  <rect x="580" y="320" width="70" height="32" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="590" y="340" font-size="9.5" fill="#263238">2</text>
  <rect x="650" y="320" width="90" height="32" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="660" y="340" font-size="9.5" fill="#263238">10 ms</text>
  <rect x="740" y="320" width="70" height="32" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="750" y="340" font-size="9.5" fill="#263238">0 ms</text>
  <rect x="810" y="320" width="100" height="32" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="820" y="340" font-size="9.5" fill="#263238">655 350 ms</text>

  <!-- Footer notes -->
  <text x="20" y="376" font-size="10" fill="#263238">Total positive response = 6 bytes: 0x50 + diagnosticSessionType + 4 record bytes (Table 26). The request that triggered it was only 2 bytes.</text>
  <text x="20" y="394" font-size="10" fill="#263238">Table 29 refers to ISO 14229-2 for the full definition of P2Server and P2*Server.</text>
</svg>
