<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">Bitwise arbitration — three nodes start transmitting in the same bit</text>
  <text x="480" y="45" text-anchor="middle" font-size="11" fill="#607d8b">every transmitter compares what it sent against what the bus actually shows, bit by bit</text>

  <!-- column headers -->
  <text x="199" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">SOF</text>
  <text x="257" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID10</text>
  <text x="315" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID9</text>
  <text x="373" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID8</text>
  <text x="431" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID7</text>
  <text x="489" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID6</text>
  <text x="547" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID5</text>
  <text x="605" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID4</text>
  <text x="663" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID3</text>
  <text x="721" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID2</text>
  <text x="779" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID1</text>
  <text x="837" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">ID0</text>
  <text x="895" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#607d8b">RTR</text>

  <!-- loss guide lines -->
  <line x1="315" y1="176" x2="315" y2="288" stroke="#c62828" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="837" y1="134" x2="837" y2="288" stroke="#c62828" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- ===== Node A ===== -->
  <text x="162" y="114" text-anchor="end" font-size="11" font-weight="bold" fill="#263238">Node A — 0x0F0</text>
  <rect x="170" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="199" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="228" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="257" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="286" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="315" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="344" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="373" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="402" y="92" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="431" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="460" y="92" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="489" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="518" y="92" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="547" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="576" y="92" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="605" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="634" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="663" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="692" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="721" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="750" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="779" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="808" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="837" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="866" y="92" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="895" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>

  <!-- ===== Node B ===== -->
  <text x="162" y="156" text-anchor="end" font-size="11" font-weight="bold" fill="#263238">Node B — 0x0F1</text>
  <rect x="170" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="199" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="228" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="257" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="286" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="315" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="344" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="373" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="402" y="134" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="431" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="460" y="134" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="489" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="518" y="134" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="547" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="576" y="134" width="58" height="34" fill="#ffffff" stroke="#b0bec5"/><text x="605" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="634" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="663" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="692" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="721" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="750" y="134" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="779" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="808" y="134" width="58" height="34" fill="#ffffff" stroke="#c62828" stroke-width="2.6"/><text x="837" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">1</text>
  <rect x="866" y="134" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="895" y="157" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>

  <!-- ===== Node C ===== -->
  <text x="162" y="198" text-anchor="end" font-size="11" font-weight="bold" fill="#263238">Node C — 0x2F0</text>
  <rect x="170" y="176" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="199" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="228" y="176" width="58" height="34" fill="#37474f" stroke="#263238"/><text x="257" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="286" y="176" width="58" height="34" fill="#ffffff" stroke="#c62828" stroke-width="2.6"/><text x="315" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">1</text>
  <rect x="344" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="373" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="402" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="431" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="460" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="489" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="518" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="547" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="576" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="605" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="634" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="663" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="692" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="721" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="750" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="779" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="808" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="837" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>
  <rect x="866" y="176" width="58" height="34" fill="#eceff1" stroke="#cfd8dc" stroke-dasharray="3 3"/><text x="895" y="199" text-anchor="middle" font-size="12" fill="#b0bec5">—</text>

  <!-- ===== Bus ===== -->
  <text x="162" y="254" text-anchor="end" font-size="11.5" font-weight="bold" fill="#e65100">BUS (wired-AND)</text>
  <rect x="170" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="199" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="228" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="257" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="286" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="315" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="344" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="373" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="402" y="232" width="58" height="34" fill="#ffffff" stroke="#f26f21" stroke-width="1.8"/><text x="431" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="460" y="232" width="58" height="34" fill="#ffffff" stroke="#f26f21" stroke-width="1.8"/><text x="489" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="518" y="232" width="58" height="34" fill="#ffffff" stroke="#f26f21" stroke-width="1.8"/><text x="547" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="576" y="232" width="58" height="34" fill="#ffffff" stroke="#f26f21" stroke-width="1.8"/><text x="605" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#607d8b">1</text>
  <rect x="634" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="663" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="692" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="721" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="750" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="779" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="808" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="837" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>
  <rect x="866" y="232" width="58" height="34" fill="#37474f" stroke="#f26f21" stroke-width="1.8"/><text x="895" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">0</text>

  <text x="30" y="290" font-size="9.5" fill="#607d8b">dark cell = dominant (0) · white cell = recessive (1)</text>

  <!-- loss callouts -->
  <text x="315" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">Node C loses at ID9</text>
  <text x="315" y="317" text-anchor="middle" font-size="9.5" fill="#c62828">sent 1, read back 0</text>
  <text x="837" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">Node B loses at ID0</text>
  <text x="837" y="317" text-anchor="middle" font-size="9.5" fill="#c62828">sent 1, read back 0</text>

  <rect x="30" y="332" width="900" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="480" y="352" text-anchor="middle" font-size="11.5" fill="#2e7d32"><tspan font-weight="bold">Node A wins with 0x0F0</tspan> and keeps transmitting without a single corrupted bit. B and C become receivers of A's frame and retry at the next bus-idle.</text>

  <text x="30" y="388" font-size="11" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>The rule is one line long: send recessive, read back dominant → you lost. Stop driving, switch to receive, keep the frame you are now hearing.</text>
  <text x="30" y="410" font-size="11" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>Dominant is 0, so the numerically <tspan font-weight="bold">lowest identifier has the highest priority</tspan> — priority is designed into the ID map at network design time.</text>
  <text x="30" y="432" font-size="11" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan><tspan font-weight="bold">Non-destructive</tspan>: nothing is discarded and no bandwidth is burned on the collision — unlike Ethernet CSMA/CD, which throws both frames away and backs off.</text>
  <text x="30" y="454" font-size="11" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>It only works if a bit driven at one end reaches the far end inside the same bit time — that constraint is why 1 Mbit/s caps the bus at roughly 40 m.</text>
</svg>
