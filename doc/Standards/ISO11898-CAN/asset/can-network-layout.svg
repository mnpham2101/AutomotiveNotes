<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">CAN network layout — one linear bus, one twisted pair, two terminations</text>
  <text x="470" y="47" text-anchor="middle" font-size="11.5" fill="#607d8b">ISO 11898-1 gives the controller its rules; ISO 11898-2 gives the transceiver its voltages</text>

  <!-- ================= nodes ================= -->
  <!-- node 1 -->
  <rect x="95" y="60" width="170" height="120" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#14337a">ECU 1 — Engine</text>
  <rect x="105" y="86" width="150" height="26" rx="3" fill="#ffffff" stroke="#90a4ae"/>
  <text x="180" y="103" text-anchor="middle" font-size="10.5" fill="#263238">MCU + application</text>
  <rect x="105" y="116" width="150" height="26" rx="3" fill="#fff3e0" stroke="#f26f21"/>
  <text x="180" y="133" text-anchor="middle" font-size="10.5" fill="#263238">CAN controller</text>
  <rect x="105" y="146" width="150" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="180" y="163" text-anchor="middle" font-size="10.5" fill="#263238">CAN transceiver</text>
  <line x1="170" y1="180" x2="170" y2="255" stroke="#c62828" stroke-width="1.6"/>
  <circle cx="170" cy="255" r="3.5" fill="#c62828"/>
  <line x1="190" y1="180" x2="190" y2="290" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="190" cy="290" r="3.5" fill="#1565c0"/>

  <!-- node 2 -->
  <rect x="300" y="60" width="170" height="120" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="385" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#14337a">ECU 2 — Gateway</text>
  <rect x="310" y="86" width="150" height="26" rx="3" fill="#ffffff" stroke="#90a4ae"/>
  <text x="385" y="103" text-anchor="middle" font-size="10.5" fill="#263238">MCU + application</text>
  <rect x="310" y="116" width="150" height="26" rx="3" fill="#fff3e0" stroke="#f26f21"/>
  <text x="385" y="133" text-anchor="middle" font-size="10.5" fill="#263238">CAN controller</text>
  <rect x="310" y="146" width="150" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="385" y="163" text-anchor="middle" font-size="10.5" fill="#263238">CAN transceiver</text>
  <line x1="375" y1="180" x2="375" y2="255" stroke="#c62828" stroke-width="1.6"/>
  <circle cx="375" cy="255" r="3.5" fill="#c62828"/>
  <line x1="395" y1="180" x2="395" y2="290" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="395" cy="290" r="3.5" fill="#1565c0"/>

  <!-- node 3 -->
  <rect x="505" y="60" width="170" height="120" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="590" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#14337a">ECU 3 — ABS</text>
  <rect x="515" y="86" width="150" height="26" rx="3" fill="#ffffff" stroke="#90a4ae"/>
  <text x="590" y="103" text-anchor="middle" font-size="10.5" fill="#263238">MCU + application</text>
  <rect x="515" y="116" width="150" height="26" rx="3" fill="#fff3e0" stroke="#f26f21"/>
  <text x="590" y="133" text-anchor="middle" font-size="10.5" fill="#263238">CAN controller</text>
  <rect x="515" y="146" width="150" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="590" y="163" text-anchor="middle" font-size="10.5" fill="#263238">CAN transceiver</text>
  <line x1="580" y1="180" x2="580" y2="255" stroke="#c62828" stroke-width="1.6"/>
  <circle cx="580" cy="255" r="3.5" fill="#c62828"/>
  <line x1="600" y1="180" x2="600" y2="290" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="600" cy="290" r="3.5" fill="#1565c0"/>

  <!-- node 4 : the tester -->
  <rect x="710" y="60" width="170" height="120" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.8"/>
  <text x="795" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Diagnostic tester</text>
  <rect x="720" y="86" width="150" height="26" rx="3" fill="#ffffff" stroke="#90a4ae"/>
  <text x="795" y="103" text-anchor="middle" font-size="10.5" fill="#263238">UDS client (ISO 14229-1)</text>
  <rect x="720" y="116" width="150" height="26" rx="3" fill="#fff3e0" stroke="#f26f21"/>
  <text x="795" y="133" text-anchor="middle" font-size="10.5" fill="#263238">CAN controller</text>
  <rect x="720" y="146" width="150" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="795" y="163" text-anchor="middle" font-size="10.5" fill="#263238">CAN transceiver</text>
  <line x1="785" y1="180" x2="785" y2="255" stroke="#c62828" stroke-width="1.6"/>
  <circle cx="785" cy="255" r="3.5" fill="#c62828"/>
  <line x1="805" y1="180" x2="805" y2="290" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="805" cy="290" r="3.5" fill="#1565c0"/>

  <!-- ================= the bus ================= -->
  <line x1="55" y1="255" x2="900" y2="255" stroke="#c62828" stroke-width="2.5"/>
  <line x1="55" y1="290" x2="900" y2="290" stroke="#1565c0" stroke-width="2.5"/>

  <rect x="248" y="247" width="56" height="16" fill="#ffffff"/>
  <text x="276" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">CAN_H</text>
  <rect x="248" y="282" width="56" height="16" fill="#ffffff"/>
  <text x="276" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">CAN_L</text>

  <!-- terminations -->
  <line x1="55" y1="255" x2="55" y2="259" stroke="#263238" stroke-width="2"/>
  <rect x="48" y="259" width="14" height="27" fill="#eceff1" stroke="#263238" stroke-width="1.6"/>
  <line x1="55" y1="286" x2="55" y2="290" stroke="#263238" stroke-width="2"/>
  <text x="55" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#263238">120 Ω</text>
  <text x="55" y="308" text-anchor="middle" font-size="10" fill="#607d8b">termination</text>

  <line x1="900" y1="255" x2="900" y2="259" stroke="#263238" stroke-width="2"/>
  <rect x="893" y="259" width="14" height="27" fill="#eceff1" stroke="#263238" stroke-width="1.6"/>
  <line x1="900" y1="286" x2="900" y2="290" stroke="#263238" stroke-width="2"/>
  <text x="900" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#263238">120 Ω</text>
  <text x="900" y="308" text-anchor="middle" font-size="10" fill="#607d8b">termination</text>

  <!-- 60 ohm callout -->
  <text x="470" y="330" text-anchor="middle" font-size="11.5" font-style="italic" fill="#e65100">the two terminations are in parallel across the pair → the driver sees a 60 Ω differential load</text>

  <!-- ================= notes ================= -->
  <text x="55" y="365" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>Bus, never a star or a ring — every node sees every bit, and sees it at the same time (within the propagation delay).</text>
  <text x="55" y="387" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>120 Ω at each physical end matches the twisted pair's characteristic impedance, so an edge is absorbed instead of reflected.</text>
  <text x="55" y="409" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>Stubs stay short (&lt; 0.3 m) — a long stub is an unterminated transmission line hanging off the bus.</text>
  <text x="55" y="431" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>Reach trades against bit rate: ≈ 40 m at 1 Mbit/s, ≈ 500 m at 125 kbit/s, ≈ 1 km at 50 kbit/s.</text>
</svg>
