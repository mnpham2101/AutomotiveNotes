<svg viewBox="0 0 940 526" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="940" height="526" fill="#ffffff"/>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14337a">Bit values are a voltage difference, not a voltage</text>

  <!-- legend -->
  <line x1="620" y1="42" x2="654" y2="42" stroke="#c62828" stroke-width="2.6"/>
  <text x="660" y="46" font-size="11" fill="#37474f">CAN_H</text>
  <line x1="720" y1="42" x2="754" y2="42" stroke="#1565c0" stroke-width="2.6" stroke-dasharray="6 3"/>
  <text x="760" y="46" font-size="11" fill="#37474f">CAN_L</text>
  <line x1="820" y1="42" x2="854" y2="42" stroke="#e65100" stroke-width="2.6"/>
  <text x="860" y="46" font-size="11" fill="#37474f">V_diff</text>

  <!-- ================= top panel : absolute levels ================= -->
  <text x="60" y="72" font-size="11.5" font-weight="bold" fill="#37474f">What a voltmeter on each wire sees</text>

  <!-- horizontal reference lines -->
  <line x1="120" y1="111" x2="880" y2="111" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="145" x2="880" y2="145" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="179" x2="880" y2="179" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="230" x2="880" y2="230" stroke="#b0bec5" stroke-width="1.4"/>
  <text x="112" y="115" text-anchor="end" font-size="10.5" fill="#607d8b">3.5 V</text>
  <text x="112" y="149" text-anchor="end" font-size="10.5" fill="#607d8b">2.5 V</text>
  <text x="112" y="183" text-anchor="end" font-size="10.5" fill="#607d8b">1.5 V</text>
  <text x="112" y="234" text-anchor="end" font-size="10.5" fill="#607d8b">0 V</text>

  <!-- bit-cell separators -->
  <line x1="215" y1="88" x2="215" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="310" y1="88" x2="310" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="405" y1="88" x2="405" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="88" x2="500" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="595" y1="88" x2="595" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="690" y1="88" x2="690" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="785" y1="88" x2="785" y2="415" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- CAN_H trace -->
  <polyline points="120,145 215,145 215,111 310,111 310,145 405,145 405,111 595,111 595,145 785,145 785,111 880,111"
            fill="none" stroke="#c62828" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- CAN_L trace -->
  <polyline points="120,145 215,145 215,179 310,179 310,145 405,145 405,179 595,179 595,145 785,145 785,179 880,179"
            fill="none" stroke="#1565c0" stroke-width="2.6" stroke-dasharray="6 3" stroke-linejoin="round"/>

  <text x="167" y="138" text-anchor="middle" font-size="9.5" fill="#607d8b">both ≈ 2.5 V</text>

  <!-- ================= bit value row ================= -->
  <text x="167" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#607d8b">1</text>
  <text x="262" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">0</text>
  <text x="357" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#607d8b">1</text>
  <text x="452" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">0</text>
  <text x="547" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">0</text>
  <text x="642" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#607d8b">1</text>
  <text x="737" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#607d8b">1</text>
  <text x="832" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">0</text>

  <text x="167" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">recessive</text>
  <text x="262" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">dominant</text>
  <text x="357" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">recessive</text>
  <text x="452" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">dominant</text>
  <text x="547" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">dominant</text>
  <text x="642" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">recessive</text>
  <text x="737" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">recessive</text>
  <text x="832" y="272" text-anchor="middle" font-size="9" fill="#90a4ae">dominant</text>

  <text x="112" y="260" text-anchor="end" font-size="10.5" font-weight="bold" fill="#37474f">bit</text>

  <!-- ================= bottom panel : differential ================= -->
  <text x="60" y="300" font-size="11.5" font-weight="bold" fill="#37474f">What the receiver actually measures: V_diff = V(CAN_H) − V(CAN_L)</text>

  <rect x="120" y="316" width="760" height="34.5" fill="#ffebee" opacity="0.55"/>
  <rect x="120" y="381.5" width="760" height="33.5" fill="#eceff1" opacity="0.8"/>

  <line x1="120" y1="415" x2="880" y2="415" stroke="#b0bec5" stroke-width="1.4"/>
  <line x1="120" y1="356.5" x2="880" y2="356.5" stroke="#f26f21" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="120" y1="381.5" x2="880" y2="381.5" stroke="#607d8b" stroke-width="1.4" stroke-dasharray="5 3"/>

  <text x="112" y="329" text-anchor="end" font-size="10.5" fill="#607d8b">2.0 V</text>
  <text x="112" y="360" text-anchor="end" font-size="10.5" fill="#e65100">0.9 V</text>
  <text x="112" y="385" text-anchor="end" font-size="10.5" fill="#607d8b">0.5 V</text>
  <text x="112" y="419" text-anchor="end" font-size="10.5" fill="#607d8b">0 V</text>

  <text x="126" y="332" font-size="9" font-style="italic" font-weight="bold" fill="#c62828">DOMINANT</text>
  <text x="126" y="398" font-size="9" font-style="italic" font-weight="bold" fill="#607d8b">RECESSIVE</text>

  <polyline points="120,415 215,415 215,325 310,325 310,415 405,415 405,325 595,325 595,415 785,415 785,325 880,325"
            fill="none" stroke="#e65100" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- ================= notes ================= -->
  <text x="60" y="447" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan><tspan font-weight="bold">Recessive = 1</tspan> — nobody drives; the terminations hold both wires together at ≈ 2.5 V, so V_diff ≈ 0 V.</text>
  <text x="60" y="469" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan><tspan font-weight="bold">Dominant = 0</tspan> — a driver pushes CAN_H up to ≈ 3.5 V and pulls CAN_L down to ≈ 1.5 V, so V_diff ≈ 2 V.</text>
  <text x="60" y="491" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>The receiver decides on the difference alone: above <tspan font-weight="bold">0.9 V</tspan> it reads dominant, below <tspan font-weight="bold">0.5 V</tspan> recessive. The gap between is deliberate hysteresis.</text>
  <text x="60" y="513" font-size="11.5" fill="#37474f"><tspan fill="#f26f21" font-weight="bold">▸ </tspan>Dominant always wins: one node driving 0 forces the whole bus to 0, whatever the others send (wired-AND).</text>
</svg>
