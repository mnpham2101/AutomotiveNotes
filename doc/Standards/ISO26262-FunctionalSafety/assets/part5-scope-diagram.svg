<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #33415c; stroke-width: 1.4; }
    .divider { stroke: #33415c; stroke-width: 1.1; }
    .num { font-size: 13px; font-weight: 700; fill: #1a2332; text-anchor: middle; }
    .lbl { font-size: 10.3px; fill: #33415c; text-anchor: middle; }
    .arrow { stroke: #33415c; stroke-width: 1.6; fill: none; marker-end: url(#arrowhead); }
    .arrow-dashed { stroke: #33415c; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .scope-label { font-size: 12px; font-style: italic; fill: #6b7a99; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#33415c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="730" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="700" fill="#1a2332">Where ISO 26262-5 Sits in the Reference Lifecycle</text>
  <text x="20" y="43" font-size="11.5" fill="#6b7a99">Part 5's six clauses (5-5 .. 5-10), and how they connect to the neighbouring clauses in Parts 4, 7 and 8</text>

  <!-- Scope of ISO 26262-5 (dashed boundary) -->
  <rect x="215" y="130" width="345" height="570" fill="none" stroke="#6b7a99" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="555" y="123" text-anchor="end" class="scope-label">Scope of ISO 26262-5</text>

  <!-- 4-6 Technical safety concept -->
  <rect x="20" y="70" width="190" height="55" class="box"/>
  <line x1="66" y1="70" x2="66" y2="125" class="divider"/>
  <text x="43" y="102" class="num">4-6</text>
  <text x="138" y="93" class="lbl">Technical safety</text>
  <text x="138" y="107" class="lbl">concept</text>

  <!-- arrow 4-6 -> 5-5 -->
  <path d="M210,97 L260,97 L260,150" class="arrow"/>

  <!-- 5-5 General topics -->
  <rect x="245" y="150" width="280" height="55" class="box"/>
  <line x1="291" y1="150" x2="291" y2="205" class="divider"/>
  <text x="268" y="182" class="num">5-5</text>
  <text x="408" y="172" class="lbl">General topics for the product</text>
  <text x="408" y="186" class="lbl">development at the hardware level</text>

  <path d="M385,205 L385,228" class="arrow"/>

  <!-- 5-6 Specification of hardware safety requirements -->
  <rect x="245" y="228" width="280" height="50" class="box"/>
  <line x1="291" y1="228" x2="291" y2="278" class="divider"/>
  <text x="268" y="257" class="num">5-6</text>
  <text x="408" y="249" class="lbl">Specification of hardware</text>
  <text x="408" y="263" class="lbl">safety requirements</text>

  <path d="M385,278 L385,301" class="arrow"/>

  <!-- 5-7 Hardware design -->
  <rect x="245" y="301" width="280" height="50" class="box"/>
  <line x1="291" y1="301" x2="291" y2="351" class="divider"/>
  <text x="268" y="330" class="num">5-7</text>
  <text x="408" y="330" class="lbl">Hardware design</text>

  <!-- 7-5 Planning for production, operation, service and decommissioning -->
  <rect x="20" y="296" width="180" height="60" class="box"/>
  <line x1="66" y1="296" x2="66" y2="356" class="divider"/>
  <text x="43" y="330" class="num">7-5</text>
  <text x="133" y="317" class="lbl">Planning for production,</text>
  <text x="133" y="331" class="lbl">operation, service and</text>
  <text x="133" y="345" class="lbl">decommissioning</text>

  <path d="M245,326 L200,326" class="arrow"/>

  <!-- branch from 5-7 to 5-8 and 5-9 -->
  <path d="M325,351 L325,405" class="arrow"/>
  <path d="M445,351 L545,351 L545,565 L525,565" class="arrow"/>

  <!-- 5-8 Evaluation of the hardware architectural metrics -->
  <rect x="245" y="405" width="280" height="60" class="box"/>
  <line x1="291" y1="405" x2="291" y2="465" class="divider"/>
  <text x="268" y="439" class="num">5-8</text>
  <text x="408" y="431" class="lbl">Evaluation of the hardware</text>
  <text x="408" y="445" class="lbl">architectural metrics</text>

  <!-- 5-9 Evaluation of safety goal violations due to random hardware failures -->
  <rect x="245" y="540" width="280" height="60" class="box"/>
  <line x1="291" y1="540" x2="291" y2="600" class="divider"/>
  <text x="268" y="574" class="num">5-9</text>
  <text x="408" y="562" class="lbl">Evaluation of safety goal</text>
  <text x="408" y="576" class="lbl">violations due to random</text>
  <text x="408" y="590" class="lbl">hardware failures</text>

  <!-- 8-13 Evaluation of hardware elements -->
  <rect x="630" y="405" width="210" height="60" class="box"/>
  <line x1="676" y1="405" x2="676" y2="465" class="divider"/>
  <text x="653" y="439" class="num">8-13</text>
  <text x="758" y="431" class="lbl">Evaluation of hardware</text>
  <text x="758" y="445" class="lbl">elements</text>

  <path d="M525,432 L630,432" class="arrow-dashed" marker-end="url(#arrowhead)"/>
  <path d="M630,442 L525,442" class="arrow-dashed" marker-end="url(#arrowhead)"/>

  <!-- 5-8 -> 5-10 (bypasses 5-9) and 5-9 -> 5-10 -->
  <path d="M325,465 L225,465 L225,655 L245,655" class="arrow"/>
  <path d="M385,600 L385,628" class="arrow"/>

  <!-- 5-10 Hardware integration and verification -->
  <rect x="245" y="628" width="280" height="55" class="box"/>
  <line x1="291" y1="628" x2="291" y2="683" class="divider"/>
  <text x="268" y="660" class="num">5-10</text>
  <text x="408" y="650" class="lbl">Hardware integration and</text>
  <text x="408" y="664" class="lbl">verification</text>

  <!-- 4-7 System and item integration and testing -->
  <rect x="630" y="628" width="210" height="55" class="box"/>
  <line x1="676" y1="628" x2="676" y2="683" class="divider"/>
  <text x="653" y="660" class="num">4-7</text>
  <text x="758" y="650" class="lbl">System and item</text>
  <text x="758" y="664" class="lbl">integration and testing</text>

  <path d="M525,655 L630,655" class="arrow"/>
  <path d="M735,465 L735,628" class="arrow"/>
</svg>
