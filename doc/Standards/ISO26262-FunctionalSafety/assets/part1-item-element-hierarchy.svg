<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #33415c; stroke-width: 1.4; }
    .txt { font-size: 12px; fill: #1a2332; text-anchor: middle; }
    .link { stroke: #33415c; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .bracket { stroke: #6b7a99; stroke-width: 1.6; fill: none; }
    .scope-lbl { font-size: 13px; font-weight: 700; fill: #6b7a99; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#33415c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="700" fill="#1a2332">Item, Element and Component (Clauses 3.84, 3.41, 3.21)</text>
  <text x="20" y="42" font-size="11.5" fill="#6b7a99">An item is realized as a hierarchy of elements, down to hardware parts and software units</text>

  <rect x="330" y="60" width="200" height="40" class="box"/>
  <text x="430" y="85" class="txt">Array of systems</text>
  <path d="M430,100 L430,125" class="link"/>

  <rect x="280" y="125" width="140" height="40" class="box"/>
  <text x="350" y="150" class="txt">Systems</text>
  <rect x="450" y="125" width="80" height="40" class="box"/>
  <text x="490" y="150" class="txt">...</text>
  <path d="M350,165 L350,190" class="link"/>

  <rect x="200" y="190" width="140" height="40" class="box"/>
  <text x="270" y="215" class="txt">E/E systems</text>
  <rect x="360" y="190" width="140" height="40" class="box"/>
  <text x="430" y="215" class="txt">Communication</text>
  <rect x="520" y="190" width="150" height="40" class="box"/>
  <text x="595" y="215" class="txt">Other technology</text>
  <path d="M270,230 L270,255" class="link"/>

  <rect x="120" y="255" width="110" height="40" class="box"/>
  <text x="175" y="280" class="txt">Sensor</text>
  <rect x="255" y="255" width="110" height="40" class="box"/>
  <text x="310" y="280" class="txt">Controller</text>
  <rect x="390" y="255" width="110" height="40" class="box"/>
  <text x="445" y="280" class="txt">Actuator</text>
  <text x="620" y="280" font-size="11" font-style="italic" fill="#6b7a99">(same hardware/software breakdown</text>
  <text x="620" y="294" font-size="11" font-style="italic" fill="#6b7a99">applies under each of the three)</text>
  <path d="M310,295 L310,320" class="link"/>

  <rect x="200" y="320" width="150" height="40" class="box"/>
  <text x="275" y="345" class="txt">Hardware components</text>
  <rect x="380" y="320" width="150" height="40" class="box"/>
  <text x="455" y="345" class="txt">Software components</text>
  <path d="M275,360 L275,385" class="link"/>
  <path d="M455,360 L455,385" class="link"/>

  <rect x="200" y="385" width="150" height="40" class="box"/>
  <text x="275" y="410" class="txt">Hardware parts</text>
  <rect x="380" y="385" width="150" height="40" class="box"/>
  <text x="455" y="410" class="txt">Software units</text>

  <path d="M760,60 L790,60 L790,165 L760,165" class="bracket"/>
  <text x="800" y="118" class="scope-lbl">Item</text>

  <path d="M760,125 L820,125 L820,445 L760,445" class="bracket"/>
  <text x="830" y="290" class="scope-lbl">Element</text>
</svg>
